<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Dynasty Performance Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky brand header + mode bar, one working column (max 1100px), fixed bottom tab bar. Single dark look taken from the logo. */
:root{
  --ink:#060807;        /* page */
  --panel:#101614;      /* raised surfaces */
  --panel-2:#17201d;    /* inputs, hover */
  --line:#24312d;       /* hairlines */
  --teal:#2A8C88;       /* brand teal */
  --teal-hi:#4FC1B9;    /* teal on dark, for text */
  --cream:#F0EBDD;      /* primary text */
  --muted:#93A39D;      /* secondary text */
  --warn:#E3B04B;
  --bad:#E06B5B;
  --good:#5CC48A;
  --c-gil:#4FC1B9; --c-johan:#E3B04B; --c-ozzy:#8FA8F0; --c-gilsr:#D58BD0;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink);color:var(--cream)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal-hi);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h2{font-size:26px}
h3{font-size:18px;letter-spacing:.04em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand img{width:46px;height:46px;border-radius:50%;flex:none}
.brand .name{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.06em;line-height:1}
.brand .sub{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.22em;color:var(--teal-hi)}
.brand .spacer{flex:1}
.callpill{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--cream);border:1px solid var(--teal);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.callpill svg{width:16px;height:16px;flex:none}
.modebar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:0 10px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--teal);color:#fff}
select.pick{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0;max-width:100%}
.demo-tag{font-size:12px;color:var(--warn);border:1px dashed var(--warn);border-radius:6px;padding:2px 8px;white-space:nowrap}

/* tabs at bottom */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--teal-hi)}

main{padding-block:16px 24px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--cream)}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--teal);background:transparent;display:inline-grid;place-items:center;color:var(--teal-hi);flex:none;text-decoration:none}
.iconbtn svg{width:18px;height:18px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.teal{border-color:var(--teal);color:var(--teal-hi)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip.good{border-color:var(--good);color:var(--good)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* schedule */
.weekstrip{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr)) auto;gap:6px;align-items:stretch}
.weekstrip .nav{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:34px;display:grid;place-items:center;color:var(--muted)}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;min-width:0}
.day .dn{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:14px}
.day .dd{font-size:12px;color:var(--muted)}
.day .open{font-size:11px;color:var(--teal-hi);margin-top:2px}
.day.on{border-color:var(--teal);background:#0f2a28}
.day.today .dn::after{content:" •";color:var(--teal-hi)}
.day.closed{opacity:.45}
.xtra{display:inline-block;font-size:10px;letter-spacing:.06em;color:var(--warn);font-weight:600}
.hour{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start;padding-block:10px;border-top:1px solid var(--line)}
.hour:first-child{border-top:0}
.hour .t{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.hour .t span{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.spots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;min-width:0}
.spot{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--panel-2);text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;border-left-width:4px}
.spot .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.spot.open{border-style:dashed;border-left-style:solid;background:transparent;color:var(--teal-hi)}
.spot.off{background:repeating-linear-gradient(135deg,transparent 0 8px,#141a18 8px 16px);color:var(--muted)}
.spot.done{opacity:.72}
.spot.cancel{opacity:.6;text-decoration:line-through}
.spot.add{border-style:dashed;background:transparent;color:var(--muted);align-items:center;justify-content:center;flex-direction:row;border-left-width:1px}
.hour-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.past .t{color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0;cursor:pointer}
.item .nm{font-weight:600}
.avatar{width:40px;height:40px;border-radius:50%;background:#123b38;color:var(--teal-hi);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;flex:none;letter-spacing:.04em}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input,.filters select,.field input,.field select,.field textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.filters input[type=number]{width:72px}
.togglechip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.togglechip.on{border-color:var(--teal);color:var(--cream);background:#0f2a28}

/* profile */
.prof-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prof-head .avatar{width:64px;height:64px;font-size:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.subtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.subtabs button.on{color:var(--cream);border-bottom-color:var(--teal-hi)}
.meter{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal)}
.preview-banner{border:1px dashed var(--warn);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.stat .u{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stats .card{display:flex;flex-direction:column;gap:6px}
svg text{fill:var(--muted);font-family:var(--body)}
.video{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:radial-gradient(circle at 30% 40%,#1d4a46,#0a1312 70%);display:grid;place-items:center;border:1px solid var(--line);position:relative;overflow:hidden}
.video .play{width:56px;height:56px;border-radius:50%;background:rgba(240,235,221,.9);display:grid;place-items:center}
.video .cap{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--cream);background:rgba(0,0,0,.55);padding:2px 8px;border-radius:6px}
.comment{border-left:3px solid var(--teal);padding:4px 10px;font-size:14px}
.comment b{font-weight:600}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:26px;line-height:1;padding:0 4px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.notice{border-radius:10px;padding:10px 12px;font-size:14px}
.notice.warn{background:#2a2210;border:1px solid var(--warn)}
.notice.info{background:#0f2a28;border:1px solid var(--teal)}
.notice.bad{background:#2a1512;border:1px solid var(--bad)}
.pick-list{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pick-list button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;border-top:1px solid var(--line);background:none;padding:8px 10px}
.pick-list button:first-child{border-top:0}
.pick-list button.on{background:#0f2a28}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--cream);color:var(--ink);padding:10px 16px;border-radius:10px;z-index:50;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.zelle{background:#1b1430;border:1px solid #6b4fd8;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.zelle .zl{font-family:var(--display);font-weight:800;font-size:22px;color:#b9a5ff;letter-spacing:.04em}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyrow code{font-family:var(--mono);background:var(--panel-2);padding:4px 8px;border-radius:6px;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
/* analyzer */
.an-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.an-grid{grid-template-columns:minmax(0,1fr)}}
.an-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.an-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.stage{position:relative;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-inline:auto;width:100%}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage-msg{pointer-events:none;position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:14px}
.an-ctrl,.an-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg.sm button{padding:4px 10px;font-size:13px}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatch.on{border-color:var(--cream);box-shadow:0 0 0 2px var(--teal)}
.an-compose{display:flex;flex-direction:column;gap:8px}
.an-compose textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.an-note.on{background:#0f2a28;border-radius:8px}
#anSeek{accent-color:var(--teal)}
.nofixed body{padding-bottom:0}
.nofixed nav.tabs{position:static;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
.nofixed .scrim{position:absolute;inset:auto;top:0;left:0;right:0;align-items:flex-start}
.nofixed .sheet{border-radius:18px;max-height:none}
.nofixed .toast{position:absolute;bottom:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  .brand .callpill .txt{display:none}
  .hour{grid-template-columns:52px 1fr}
  .day .ol{display:none}
  .day .dd{font-size:11px}
  .xtra{font-size:0}.day .xtra::before{content:"+";font-size:12px}
  .weekstrip{gap:4px}.weekstrip .nav{width:26px}
  .hour .t{font-size:17px}
  h2{font-size:22px}
}
/* LIGHT v2: near-white page, white cards, firm dividers, filled chips, black header + tab bar */
:root{--ink:#F3F5F4;--panel:#FFFFFF;--panel-2:#F3F5F4;--line:#C9D1CE;--teal:#1C7570;--teal-hi:#135E5A;--cream:#0E1412;--muted:#46524D;--warn:#93600C;--bad:#A8321F;--good:#23703F;
  --c-gil:#1C9A91;--c-johan:#D39A17;--c-ozzy:#4F6FD3;--c-gilsr:#A9539F;color-scheme:light}
html,body{background:var(--ink);color:var(--cream)}
body{font-size:15.5px}
.muted{color:var(--muted)}
h2{color:#060807;font-size:28px}
h3{color:#060807}
.label{color:#3C4843}
/* header + tabs stay black */
header.top{background:#060807;border-bottom:3px solid #2A8C88;color:#F0EBDD}
body::before{background:#060807}
header.top .seg{background:#141a18;border-color:#2c3a36}
header.top .seg button{color:#A9B7B1}
header.top .seg button.on{background:#2A8C88;color:#fff}
header.top select.pick{background:#141a18;color:#F0EBDD;border-color:#2c3a36}
header.top .callpill{color:#F0EBDD;border-color:#2A8C88}
header.top .brand .sub{color:#4FC1B9}
header.top .demo-tag{color:#E3B04B;border-color:#E3B04B}
nav.tabs{background:#060807;border-top:0}
nav.tabs button{color:#A9B7B1;position:relative}
nav.tabs button.on{color:#fff}
nav.tabs button.on::after{content:"";position:absolute;left:28%;right:28%;bottom:4px;height:3px;border-radius:3px;background:#4FC1B9}
.nofixed nav.tabs{border-bottom:1px solid #2A8C88}
/* surfaces */
.card,.tile{background:#fff;border:1px solid var(--line);box-shadow:0 1px 3px rgba(14,20,18,.06)}
.item{border-top:1px solid #DCE2E0}
.hour{border-top:1px solid #D2D9D6;grid-template-columns:76px 1fr}
.hour .t{border-right:2px solid #E1E6E4;padding-right:8px;color:#060807;font-size:22px}
.hour .t span{color:#46524D;font-weight:600}
.hour:nth-child(even){background:#FAFBFB;margin-inline:-14px;padding-inline:14px}
.past .t{color:#8A9692}
/* week strip */
.day{background:#fff;border:1px solid var(--line)}
.day .dn{color:#060807}
.day .dd{color:#46524D}
.day .open{color:#135E5A;font-weight:600}
.day.on{background:#060807;border-color:#060807}
.day.on .dn,.day.on .dd{color:#F0EBDD}
.day.on .open{color:#4FC1B9}
.day.closed{opacity:.55}
.weekstrip .nav{background:#fff;border-color:var(--line);color:#060807}
/* spots */
.spot{background:#fff;border:1px solid #C9D1CE;border-left-width:5px;box-shadow:0 1px 2px rgba(14,20,18,.05)}
.spot .who{color:#060807}
.spot .meta{color:#46524D}
.spot.open{background:#F2FAF9;border:1.5px dashed #1C7570;border-left:5px solid #1C9A91;color:#135E5A;box-shadow:none}
.spot.open .who{color:#135E5A}
.spot.open:hover{background:#E3F4F2}
.spot.off{background:repeating-linear-gradient(135deg,#F5F7F6 0 8px,#E7ECEA 8px 16px);color:#6B7772;box-shadow:none}
.spot.off .who{color:#5E6A65}
.spot.add{background:#fff;border:1.5px dashed #9AA6A2;color:#3C4843}
/* chips: filled, readable */
.chip{border:0;background:#E9EDEB;color:#33403B;font-weight:500}
.chip.teal{background:#DFF1EE;color:#135E5A}
.chip.warn{background:#FBEFD6;color:#7A4E07}
.chip.bad{background:#FBE2DD;color:#9A2C1B}
.chip.good{background:#DFF2E6;color:#1E6236}
/* controls */
.btn{background:#fff;border:1px solid #B9C3BF;color:#0E1412;font-weight:600}
.btn:hover{border-color:#1C7570;background:#F2FAF9}
.btn.primary{background:#060807;border-color:#060807;color:#fff}
.btn.primary:hover{background:#1C7570;border-color:#1C7570}
.btn.ghost{background:transparent}
.btn.danger{border-color:#A8321F;color:#A8321F;background:#fff}
.iconbtn{border:1.5px solid #1C7570;color:#1C7570;background:#fff}
.filters input,.filters select,.field input,.field select,.field textarea,.an-compose textarea{background:#fff;border:1px solid #B9C3BF;color:#0E1412}
.togglechip{border:1px solid #B9C3BF;color:#33403B;background:#fff}
.togglechip.on{background:#060807;border-color:#060807;color:#fff}
.subtabs{border-bottom:2px solid #D2D9D6}
.subtabs button{color:#5E6A65}

function packUsed(p){return p.usedBefore+S.bookings.filter(b=>b.packId===p.id&&(b.status==="completed"||b.status==="late")).length}
function packLeft(p){return Math.max(0,p.total-packUsed(p))}
function activePack(athleteId,serviceId,onDate){
  return S.packs.filter(p=>p.athleteId===athleteId&&p.serviceId===serviceId&&p.purchased<=onDate&&p.expires>=onDate&&packLeft(p)>0)
    .sort((a,b)=>a.expires<b.expires?-1:1)[0]||null;
}
function currentPack(athleteId,serviceId){
  const t=ymd(new Date());
  return activePack(athleteId,serviceId,t)||S.packs.filter(p=>p.athleteId===athleteId&&p.serviceId===serviceId).sort((a,b)=>a.purchased<b.purchased?1:-1)[0]||null;
}
function scheduledCount(athleteId,serviceId){return S.bookings.filter(b=>b.athleteId===athleteId&&b.serviceId===serviceId&&b.status==="booked"&&startOf(b.date,b.hour)>new Date()).length}
/* status changes: completed and late both use a session; forgiven gives it back */
function setStatus(b,st,quiet){
  const used=st==="completed"||st==="late";
  if(used&&!b.packId&&!b.single){
    const p=activePack(b.athleteId,b.serviceId,b.date);
    if(p)b.packId=p.id;else if(svc(b.serviceId).single!=null){b.single=true;b.paid=false}
  }
  if(st==="forgiven"||st==="cancelled"||st==="booked"){b.packId=null;b.single=false;b.paid=false;b.pending=false}
  b.status=st;
  if(!quiet)save();
}
function lateCounts(aid){const bs=S.bookings.filter(b=>b.athleteId===aid);return{late:bs.filter(b=>b.status==="late"||b.status==="forgiven").length,forgiven:bs.filter(b=>b.status==="forgiven").length}}
/* capacity */
function hourBookings(coachId,date,hour){return S.bookings.filter(b=>b.coachId===coachId&&b.date===date&&b.hour===hour&&b.status!=="cancelled")}
const holdsSpot=b=>b.status==="booked"||b.status==="completed";
function hourBlocks(coachId,date,hour){return S.blocks.filter(x=>x.coachId===coachId&&x.date===date&&x.hour===hour)}
function capService(coachId){return S.services.find(s=>s.coachId===coachId&&s.sched&&s.spots)}
function openSpots(serviceId,date,hour){
  const s=svc(serviceId);if(!isOpenHour(s.coachId,date,hour))return 0;if(!s.spots)return Infinity;
  const used=S.bookings.filter(b=>b.serviceId===serviceId&&b.date===date&&b.hour===hour&&holdsSpot(b)).length;
  return Math.max(0,s.spots-used-hourBlocks(s.coachId,date,hour).length);
}
function owed(aid){
  const singles=S.bookings.filter(b=>b.athleteId===aid&&b.single&&!b.paid&&svc(b.serviceId).single!=null).map(b=>({kind:"single",ref:b,amount:svc(b.serviceId).single,label:`${svc(b.serviceId).name} · ${dlabel(b.date)} ${hlabel(b.hour)}${b.status==="late"?" (late cancel)":""}`,pending:b.pending}));
  const packs=S.packs.filter(p=>p.athleteId===aid&&!p.paid).map(p=>({kind:"pack",ref:p,amount:p.price,label:`${svc(p.serviceId).name} · ${p.total}-session pack`,pending:p.pending}));
  const vids=S.videos.filter(v=>v.athleteId===aid&&!v.paid).map(v=>({kind:"video",ref:v,amount:svc("video").single,label:`Video swing analysis · ${v.title}`,pending:v.pending}));
  return [...singles,...packs,...vids].filter(o=>o.amount!=null);
}

function hourRow(date,h,coachIds){
  const past=startOf(date,h)<new Date();
  let cells="";let actions="";
  let extraFor=[];
  coachIds.forEach(cid=>{
    const c=coach(cid);const cap=capService(cid);
    const isOpen=isOpenHour(cid,date,h);
    if(isExtra(cid,date,h))extraFor.push(c.short);
    const bs=hourBookings(cid,date,h).filter(b=>b.status!=="forgiven"||coachIds.length===1);
    bs.forEach(b=>cells+=spotCard(b,c));
    if(!isOpen)return;
    if(cap){
      const blocks=hourBlocks(cid,date,h);
      blocks.forEach(x=>cells+=`<button class="spot off" style="border-left-color:${c.color}" data-act="unblock" data-v="${x.id}"><span class="who">Unavailable</span><span class="meta">${esc(c.short)} · tap to reopen</span></button>`);
      const open=openSpots(cap.id,date,h);
      for(let i=0;i<open;i++){
        if(past){cells+=`<button class="spot off" style="border-left-color:${c.color}" data-act="pastSpot"><span class="who">Open (passed)</span><span class="meta">${esc(cap.name)}</span></button>`;continue}
        cells+=`<button class="spot open" style="border-left-color:${c.color}" data-act="bookSpot" data-c="${cid}" data-s="${cap.id}" data-d="${date}" data-h="${h}"><span class="who">Open spot</span><span class="meta">${esc(cap.name)} · tap to book${(L=>L?` <span class="chip teal">${L}</span>`:"")(limLabel(limFor(cap.id,date,h)))}</span></button>`;
      }
      if(!past&&open>0&&coachIds.length===1){actions+=`<button class="btn sm" data-act="broadcast" data-s="${cap.id}" data-d="${date}" data-h="${h}">Broadcast ${open} open</button><button class="btn sm ghost" data-act="block" data-c="${cid}" data-d="${date}" data-h="${h}">Mark 1 unavailable</button>`}
    }else if(coachIds.length===1){
      const blocks=hourBlocks(cid,date,h);
      if(blocks.length){cells+=`<button class="spot off" style="border-left-color:${c.color}" data-act="unblock" data-v="${blocks[0].id}"><span class="who">Unavailable</span><span class="meta">Tap to reopen</span></button>`}
      else if(!past){cells+=`<button class="spot add" data-act="bookSpot" data-c="${cid}" data-d="${date}" data-h="${h}">+ Add appointment</button>`;
        actions+=`<button class="btn sm ghost" data-act="block" data-c="${cid}" data-d="${date}" data-h="${h}">Mark unavailable</button>`}
    }
  });
  if(coachIds.length>1){
    const open=past||!svc("hit").spots?0:openSpots("hit",date,h);
    if(open>0)actions+=`<button class="btn sm" data-act="broadcast" data-s="hit" data-d="${date}" data-h="${h}">Broadcast ${open} open</button>`;
    if(!cells)cells=`<div class="muted small" style="padding:8px 0">Nothing booked</div>`;
  }
  if(extraFor.length&&!past&&coachIds.length===1&&!hourBookings(coachIds[0],date,h).some(holdsSpot))actions+=`<button class="btn sm ghost" data-act="closeExtra" data-c="${coachIds[0]}" data-d="${date}" data-h="${h}">Close this extra hour</button>`;
  return `<div class="hour ${past?"past":""}"><div class="t num">${hlabel(h).split(" ")[0]}<span>${hlabel(h).split(" ")[1]}</span>${extraFor.length?`<span class="xtra">EXTRA${coachIds.length>1?" · "+esc(extraFor.join(", ")):""}</span>`:""}</div>
    <div><div class="spots">${cells}</div>${actions?`<div class="hour-actions">${actions}</div>`:""}</div></div>`;
}
function spotCard(b,c){
  const a=ath(b.athleteId);const s=svc(b.serviceId);
  const p=s.packSize?currentPack(a.id,s.id):null;
  let tag="";
  if(b.status==="completed")tag=`<span class="chip good">Done</span>`;
  else if(b.status==="late")tag=`<span class="chip bad">Late cancel · counted</span>`;
  else if(b.status==="forgiven")tag=`<span class="chip">Late cancel · forgiven</span>`;
  else if(p&&s.packSize){const l=packLeft(p);tag=`<span class="chip ${l<=2?"warn":"teal"} num">${l} left</span>`}
  else if(s.single!=null)tag=`<span class="chip warn">Pays ${money(s.single)}</span>`;
  const cls=b.status==="completed"?"done":(b.status==="late"||b.status==="forgiven")?"cancel":"";
  return `<button class="spot ${cls}" style="border-left-color:${c.color}" data-act="openBooking" data-v="${b.id}">
    <span class="who">${esc(fullname(a))}</span>
    <span class="meta">${b.recurringId?ICON.repeat:""}<span>${esc(s.name)}</span>${tag}</span></button>`;
}

/* who a session is for: an extra-hours block's limits win over the session type's */
function limFor(serviceId,date,hour){const s=svc(serviceId);const ex=(S.extra||[]).find(x=>x.coachId===s.coachId&&x.date===date&&x.hour===hour&&(x.minAge!=null||x.maxAge!=null||(x.levels&&x.levels.length)));const src=ex||s;return{minAge:src.minAge??null,maxAge:src.maxAge??null,levels:src.levels||[]}}

const isWeekday=d=>{const x=parse(d).getDay();return x>=1&&x<=5};

function isExtra(coachId,date,hour){return (S.extra||[]).some(x=>x.coachId===coachId&&x.date===date&&x.hour===hour)}
function isOpenHour(coachId,date,hour){return (isWeekday(date)&&HOURS.includes(hour))||isExtra(coachId,date,hour)}

function bkSave(){

    S.recurring.push(r);

    let skipped=0;
    for(let w=0;w<5;w++){const d=ymd(addDays(parse(ps.date),w*7));r.start=ps.date;const key=r.id+"|"+d;S.gen[key]=1;
      if(svc(ps.serviceId).spots&&openSpots(ps.serviceId,d,h)<=0){skipped++;continue}
      S.bookings.push(mkBooking(ps.athleteId,ps.coachId,ps.serviceId,d,h,r.id))}
    save();closeModal();render();toast(`Booked ${fullname(ath(ps.athleteId))} every ${DAYS[parse(ps.date).getDay()]} at ${hlabel(h)}${skipped?` · ${skipped} full week(s) skipped`:""}`);
  }else{

  }
}

function statSeries(a){
  const R=rng(a.id.charCodeAt(1)*97+a.age);
  const n=6;const base={ev:48+a.age*3.2,sixty:9.2-a.age*0.12,pv:a.pos.includes("HP")?38+a.age*3:null,wt:70+a.age*6.5,ht:50+a.age*1.4,tb:60+a.age*14};
  const mk=(b,step,dec)=>Array.from({length:n},(_,i)=>+(b+step*i+(R()-.5)*Math.abs(step)*1.4).toFixed(dec));
  return {ev:{n:"Exit velocity",u:"mph",d:mk(base.ev,1.1,1),better:1},sixty:{n:"60-yard dash",u:"sec",d:mk(base.sixty,-0.05,2),better:-1},
    pv:base.pv?{n:"Pitch velocity",u:"mph",d:mk(base.pv,0.9,1),better:1}:null,tb:{n:"Trap-bar deadlift",u:"lb",d:mk(base.tb,7,0),better:1},
    wt:{n:"Weight",u:"lb",d:mk(base.wt,1.2,0),better:0},ht:{n:"Height",u:"in",d:mk(Math.min(base.ht,74),a.age<17?0.3:0,1),better:0}};
}
function spark(d,better){
  const w=140,h=36,p=4;const mn=Math.min(...d),mx=Math.max(...d);const sc=v=>mx===mn?h/2:h-p-(v-mn)/(mx-mn)*(h-2*p);
  const pts=d.map((v,i)=>`${(p+i*(w-2*p)/(d.length-1)).toFixed(1)},${sc(v).toFixed(1)}`);
  const up=d[d.length-1]-d[0];const good=better===0?null:(up*better>0);
  const col=good==null?"var(--muted)":good?"var(--good)":"var(--bad)";
  const last=pts[pts.length-1].split(",");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${p},${h-1} ${pts.join(" ")} ${w-p},${h-1}" fill="${col}" fill-opacity=".12" stroke="none"/><polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${col}"/></svg>`;
}
function radar(a){
  const cx=160,cy=150,r=105;const N=TOOLS.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*r*v/10,cy+Math.sin(ang(i))*r*v/10];
  let g="";
  [2,4,6,8,10].forEach(v=>{g+=`<polygon points="${TOOLS.map((_,i)=>pt(i,v).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`});
  TOOLS.forEach((_,i)=>{const[x,y]=pt(i,10);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`});
  const poly=TOOLS.map((t,i)=>pt(i,a.tools[t.k]).join(",")).join(" ");
  g+=`<polygon points="${poly}" fill="var(--teal)" fill-opacity=".35" stroke="var(--teal-hi)" stroke-width="2"/>`;
  TOOLS.forEach((t,i)=>{const[x,y]=pt(i,a.tools[t.k]);g+=`<circle cx="${x}" cy="${y}" r="3.5" fill="var(--teal-hi)"/>`;
    const[lx,ly]=pt(i,12.6);const anchor=Math.abs(lx-cx)<8?"middle":lx>cx?"start":"end";
    g+=`<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="11.5" dominant-baseline="middle">${t.n} · ${a.tools[t.k]}</text>`});
  return `<svg viewBox="-40 0 400 300" width="100%" style="max-width:460px" role="img" aria-label="Six Tools scores">${g}</svg>`;
}

const memBlobs={};const urlCache={};
const IDB={
  db:null,
  open(){if(IDB.db)return Promise.resolve(IDB.db);return new Promise((res,rej)=>{try{const r=indexedDB.open("dynasty-videos",1);r.onupgradeneeded=()=>r.result.createObjectStore("v");r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>{db.close();IDB.db=null};IDB.db=db;res(db)};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"))}catch(e){rej(e)}})},
  wipe(){if(IDB.db){try{IDB.db.close()}catch(e){}IDB.db=null}return new Promise(res=>{try{const r=indexedDB.deleteDatabase("dynasty-videos");r.onsuccess=r.onerror=r.onblocked=()=>res()}catch(e){res()}setTimeout(res,1500)})},
  async put(k,blob){memBlobs[k]=blob;try{const db=await IDB.open();await new Promise((res,rej)=>{const tx=db.transaction("v","readwrite");tx.objectStore("v").put(blob,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return true}catch(e){return false}},
  async get(k){if(memBlobs[k])return memBlobs[k];try{const db=await IDB.open();return await new Promise((res,rej)=>{const r=db.transaction("v").objectStore("v").get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch(e){return null}},
  async del(k){delete memBlobs[k];try{const db=await IDB.open();db.transaction("v","readwrite").objectStore("v").delete(k)}catch(e){}}
};

function mountAnalyzer(v){
  const stage=$("#stage"),cv=$("#cv"),vid=$("#vid");if(!stage||!cv)return;
  const ctx=cv.getContext("2d");
  const coachMode=U.mode==="coach";
  AN.v=v;
  function fit(ratio){
    stage.style.aspectRatio=String(ratio);
    stage.style.width=`min(100%, calc(62vh * ${ratio}))`;
    requestAnimationFrame(size);
  }
  function size(){const w=stage.clientWidth,h=stage.clientHeight;const dpr=window.devicePixelRatio||1;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+"px";cv.style.height=h+"px";draw()}

  const W=()=>cv.width,H=()=>cv.height;

  function drawSample(){
    // a still "frame" for seeded sample videos: batter silhouette on a cage background
    const w=W(),h=H();const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"#0f2523");g.addColorStop(1,"#071110");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);

    ctx.fillStyle="#1d3a37";ctx.fillRect(0,h*.86,w,h*.14);
    ctx.strokeStyle="#c9c2b0";ctx.lineCap="round";ctx.lineWidth=Math.max(6,w*.014);
    const s=(x,y)=>[w*x,h*y];const L=(a,b)=>{ctx.beginPath();ctx.moveTo(...s(...a));ctx.lineTo(...s(...b));ctx.stroke()};
    ctx.fillStyle="#c9c2b0";ctx.beginPath();ctx.arc(...s(.47,.25),w*.03,0,7);ctx.fill();
    L([.47,.3],[.49,.55]);L([.49,.55],[.42,.7]);L([.42,.7],[.40,.86]);L([.49,.55],[.57,.7]);L([.57,.7],[.60,.86]);
    L([.48,.34],[.42,.40]);L([.42,.40],[.45,.33]);L([.48,.34],[.44,.36]);
    ctx.strokeStyle="#8a6a3e";ctx.lineWidth=Math.max(4,w*.009);L([.45,.33],[.53,.12]);
    ctx.fillStyle="rgba(240,235,221,.5)";ctx.font=`${Math.max(11,w*.018)}px IBM Plex Sans, sans-serif`;ctx.fillText("Sample frame · upload a real clip to try playback",w*.03,h*.07);
  }
  function shapeDraw(sh){
    ctx.strokeStyle=sh.color;ctx.fillStyle=sh.color;ctx.lineWidth=Math.max(3,W()*.005);ctx.lineCap="round";ctx.lineJoin="round";
    const pts=sh.pts.map(P);if(!pts.length)return;
    if(sh.type==="free"){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();return}
    if(pts.length<2)return;
    const [a,b]=pts;
    if(sh.type==="line"||sh.type==="arrow"){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();
      if(sh.type==="arrow"){const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);const hl=Math.max(14,W()*.025);ctx.beginPath();ctx.moveTo(...b);ctx.lineTo(b[0]-hl*Math.cos(ang-.45),b[1]-hl*Math.sin(ang-.45));ctx.lineTo(b[0]-hl*Math.cos(ang+.45),b[1]-hl*Math.sin(ang+.45));ctx.closePath();ctx.fill()}}
    if(sh.type==="circle"){ctx.beginPath();ctx.arc(a[0],a[1],Math.hypot(b[0]-a[0],b[1]-a[1]),0,Math.PI*2);ctx.stroke()}
    if(sh.type==="angle"){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);if(pts[2])ctx.lineTo(...pts[2]);ctx.stroke();
      if(pts[2]){const c=pts[2];const a1=Math.atan2(a[1]-b[1],a[0]-b[0]),a2=Math.atan2(c[1]-b[1],c[0]-b[0]);let d=Math.abs(a1-a2);if(d>Math.PI)d=2*Math.PI-d;

        const fs=Math.max(13,W()*.022);ctx.font=`600 ${fs}px IBM Plex Sans, sans-serif`;const mid=s0+diff/2;const tx=b[0]+Math.cos(mid)*(r+fs),ty=b[1]+Math.sin(mid)*(r+fs);
        ctx.fillStyle="rgba(0,0,0,.65)";const tw=ctx.measureText(deg+"°").width;ctx.fillRect(tx-tw/2-4,ty-fs*.8,tw+8,fs*1.15);ctx.fillStyle=sh.color;ctx.textAlign="center";ctx.fillText(deg+"°",tx,ty);ctx.textAlign="start"}}
  }
  function draw(){
    ctx.clearRect(0,0,W(),H());
    if(!vid)drawSample();
    const n=AN.shown&&v.notes.find(x=>x.id===AN.shown);
    if(n)(n.shapes||[]).forEach(shapeDraw);

    return notes.length?notes.map(n=>`<div class="item an-note ${AN.shown===n.id?"on":""}" style="align-items:flex-start"><button class="chip teal num" data-act="anJump" data-v="${n.id}">${fmtT(n.t)}</button>
      <div class="grow"><div class="small"><b>${n.by==="athlete"?esc(ath(v.athleteId).first):esc(coach(n.by).short)}</b>${n.shapes&&n.shapes.length?` <span class="muted">· ${n.shapes.length} drawing${n.shapes.length>1?"s":""}</span>`:""}</div><div style="white-space:pre-wrap">${esc(n.text)||'<span class="muted">(drawing only)</span>'}</div>
      ${(coachMode&&n.by!=="athlete")||(!coachMode&&n.by==="athlete")?`<div class="row" style="gap:6px;margin-top:4px">${coachMode?`<button class="btn sm ghost" data-act="anEdit" data-v="${n.id}">Edit</button>`:""}<button class="btn sm ghost" data-act="anDel" data-v="${n.id}">Delete</button></div>`:""}</div></div>`).join("")
      :`<div class="empty small">${coachMode?"No notes yet. Pause, draw on the frame, and save a note.":"Your coach hasn't added notes yet."}</div>`;
  }
  AN.list=()=>{const l=$("#anList");if(l)l.innerHTML=listHTML()};
  AN.list();
  const timeEl=$("#anTime"),seek=$("#anSeek"),playBtn=$("#anPlay");
  function syncTime(){if(!vid)return;const d=vid.duration||0;timeEl.textContent=`${fmtT(vid.currentTime)} / ${fmtT(d)}`;if(d&&!AN.scrubbing)seek.value=Math.round(vid.currentTime/d*1000);const lbl=$("#anComposeLbl");if(lbl&&!AN.editing)lbl.textContent=`New note at ${fmtT(vid.currentTime)}`}
  AN.sync=syncTime;
  if(!vid){fit(16/9);[playBtn,seek,...document.querySelectorAll('[data-act="anStep"],[data-act="anRate"]')].forEach(b=>b&&(b.disabled=true));timeEl.textContent="Still frame";
    if(v.notes[0]){AN.shown=v.notes[0].id;AN.list();draw()}}
  else{
    videoURL(v).then(url=>{
      if(!url){const m=$("#stageMsg");m.hidden=false;m.textContent="This video was uploaded on another device or browser. In the demo, videos stay where they were uploaded.";fit(16/9);return}
      vid.src=url;
    });
    vid.addEventListener("loadedmetadata",()=>{fit((vid.videoWidth||16)/(vid.videoHeight||9));syncTime()});
    vid.addEventListener("timeupdate",()=>{
      const t=vid.currentTime;
      if(!vid.paused&&AN.stopAtNotes){const hit=v.notes.filter(n=>n.t>AN.lastT+0.01&&n.t<=t+0.04).sort((a,b)=>a.t-b.t)[0];if(hit){vid.pause();vid.currentTime=hit.t;AN.shown=hit.id;AN.list();draw();AN.lastT=hit.t;syncTime();return}}
      if(!vid.paused){const recent=v.notes.filter(n=>n.t<=t&&t-n.t<1.5).sort((a,b)=>b.t-a.t)[0];const id=recent?recent.id:null;if(id!==AN.shown){AN.shown=id;AN.list();draw()}}
      AN.lastT=t;syncTime();
    });
    vid.addEventListener("play",()=>{playBtn.textContent="Pause";draw()});
    vid.addEventListener("pause",()=>{playBtn.textContent="Play"});
    vid.addEventListener("ended",()=>{playBtn.textContent="Play";AN.lastT=-1});
    seek.addEventListener("input",()=>{AN.scrubbing=true;if(vid.duration){vid.currentTime=seek.value/1000*vid.duration;AN.lastT=vid.currentTime;const near=v.notes.find(n=>Math.abs(n.t-vid.currentTime)<0.15);AN.shown=near?near.id:null;AN.list();draw()}});
    seek.addEventListener("change",()=>{AN.scrubbing=false;syncTime()});
  }
  /* drawing */
  if(coachMode){
    const pos=e=>{const r=cv.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
    cv.style.touchAction="none";cv.style.cursor="crosshair";
    cv.addEventListener("pointerdown",e=>{
      if(vid&&!vid.paused)vid.pause();
      cv.setPointerCapture(e.pointerId);const p=pos(e);
      if(AN.tool==="angle"&&AN.drawing&&AN.drawing.type==="angle"&&AN.drawing.pts.length===2){AN.drawing.pts.push(p);AN.angleThird=true;draw();return}
      AN.drawing={type:AN.tool,color:AN.color,pts:AN.tool==="free"?[p]:[p,p]};draw();
    });
    cv.addEventListener("pointermove",e=>{
      if(!AN.drawing)return;const p=pos(e);
      if(AN.drawing.type==="free"){AN.drawing.pts.push(p)}
      else if(AN.drawing.type==="angle"&&AN.angleThird){AN.drawing.pts[2]=p}
      else if(e.buttons||e.pointerType==="touch"){AN.drawing.pts[1]=p}
      draw();
    });
    cv.addEventListener("pointerup",e=>{
      if(!AN.drawing)return;const d=AN.drawing;
      if(d.type==="angle"&&!AN.angleThird){if(Math.hypot(d.pts[1][0]-d.pts[0][0],d.pts[1][1]-d.pts[0][1])<0.01){AN.drawing=null;draw();toast("Angle: drag along one line, then tap the third point")}return}
      AN.angleThird=false;
      const tiny=d.type!=="free"&&Math.hypot(d.pts[1][0]-d.pts[0][0],d.pts[1][1]-d.pts[0][1])<0.008;
      if(!tiny&&!(d.type==="free"&&d.pts.length<3))AN.draft.push(d);
      AN.drawing=null;draw();
    });
  }
  const ro=new ResizeObserver(()=>size());ro.observe(stage);
  AN.cleanup=()=>{ro.disconnect();if(vid)vid.pause()};
}
function anSave(){
  const v=AN.v;const txt=($("#anText").value||"").trim();const coachMode=U.mode==="coach";
  if(!txt&&!AN.draft.length){toast(coachMode?"Draw something or type a note first":"Type a reply first");return}
  const vid=$("#vid");const t=vid?vid.currentTime:0;
  if(AN.editing){const n=v.notes.find(x=>x.id===AN.editing);n.text=txt;n.shapes=AN.draft.slice();AN.editing=null;$("#anCancel").hidden=true;$("#anSaveBtn").textContent="Save note";toast("Note updated");AN.shown=n.id}
  else{const n={id:"n"+uid(),t:+t.toFixed(3),text:txt,shapes:coachMode?AN.draft.slice():[],by:coachMode?v.coachId:"athlete",at:ymd(new Date())};v.notes.push(n);AN.shown=n.id;toast(coachMode?`Note saved at ${fmtT(t)}`:"Reply sent")}

/* ---------- Six Tools: working ---------- */
function ensureDev(a){
  if(a.meas&&a.train&&a.toolHist)return;
  const st=statSeries(a);a.meas={};
  Object.entries(st).forEach(([k,s])=>{if(!s)return;a.meas[k]=s.d.map((v,i)=>({date:ymd(addDays(new Date(),-(5-i)*30-3)),v,by:"coach"}))});
  const R=rng(a.age*31+a.first.length);
  const drills={avg:"Tee work, opposite-field focus",pow:"Overload/underload bat speed",fld:"Short-hop series, glove work",arm:"Long toss + arm care band routine",spd:"Acceleration starts, 10-yd splits",mnt:"Breathing reset + vision reaction board"};
  a.train=Array.from({length:6},(_,i)=>{const t=TOOLS[Math.floor(R()*TOOLS.length)];return{id:uid(),date:ymd(addDays(new Date(),-(i*4+2))),tool:t.k,coachId:t.c,drill:drills[t.k],note:""}});
  a.toolHist=TOOLS.map(t=>({k:t.k,v:Math.max(1,a.tools[t.k]-(R()>.5?1:0)),date:ymd(addDays(new Date(),-60)),by:t.c}));
}
const MEAS={ev:{n:"Exit velocity",u:"mph",better:1,dec:1},sixty:{n:"60-yard dash",u:"sec",better:-1,dec:2},pv:{n:"Pitch velocity",u:"mph",better:1,dec:1},tb:{n:"Trap-bar deadlift",u:"lb",better:1,dec:0},wt:{n:"Weight",u:"lb",better:0,dec:0},ht:{n:"Height",u:"in",better:0,dec:1}};

  const month=ymd(addDays(new Date(),-30));
  const perTool=Object.fromEntries(TOOLS.map(t=>[t.k,a.train.filter(x=>x.tool===t.k&&x.date>=month).length]));
  const maxT=Math.max(1,...Object.values(perTool));
  const vids=S.videos.filter(v=>v.athleteId===a.id&&v.status==="ready"&&v.tool);
  return `<div class="grid2"><div class="card"><h3>The Six Tools</h3><div class="muted small">Coach rating, 1 to 10${coachMode?" · tap − or + to update":""}</div>${radar(a)}
    <div class="list">${TOOLS.map(t=>{const d=since(t.k);const mine=coachMode&&(U.coachView==="all"||U.coachView===t.c);return `<div class="item" style="padding-block:6px"><span class="dot" style="background:${coach(t.c).color}"></span><div class="grow small">${t.n}<div class="muted" style="font-size:12px">${esc(coach(t.c).short)}${d?` · <span style="color:${d>0?"var(--good)":"var(--bad)"}">${d>0?"+":""}${d} in 60 days</span>`:""}</div></div>
      ${mine?`<button class="btn sm" data-act="tScore" data-v="${t.k}" data-d="-1" aria-label="Lower ${t.n}">−</button>`:""}<span class="num" style="width:26px;text-align:center;font-weight:600">${a.tools[t.k]}</span>${mine?`<button class="btn sm" data-act="tScore" data-v="${t.k}" data-d="1" aria-label="Raise ${t.n}">+</button>`:""}</div>`}).join("")}</div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="row between"><h3>Training log</h3><button class="btn sm" data-act="logTrain">+ Log training</button></div>
    <div class="label">Last 30 days by tool</div>
    <div style="display:flex;flex-direction:column;gap:5px">${TOOLS.map(t=>`<div class="row small" style="gap:8px;flex-wrap:nowrap"><span style="width:128px;flex:none" class="muted">${t.n}</span><div class="meter grow"><i style="width:${perTool[t.k]/maxT*100}%;background:${coach(t.c).color}"></i></div><span class="num" style="width:16px;text-align:right">${perTool[t.k]}</span></div>`).join("")}</div>
    <div class="list">${a.train.slice().sort((x,y)=>x.date<y.date?1:-1).slice(0,8).map(l=>{const t=TOOLS.find(x=>x.k===l.tool);return `<div class="item"><span class="dot" style="background:${coach(l.coachId).color}"></span><div class="grow"><div class="small">${dlong(l.date)} · <b>${t.n}</b></div><div class="muted small">${esc(coach(l.coachId).short)} · ${esc(l.drill)}${l.note?" · "+esc(l.note):""}${l.by==="athlete"?" · by athlete":""}</div></div></div>`}).join("")}</div>

    return `<div class="card"><div class="label">${m.n}</div><div class="stat"><span class="v num">${l}</span><span class="u">${m.u}${d.length>1?` · ${ch>=0?"+":""}${ch.toFixed(m.dec)} since ${dlabel(d[0].date)}`:` · ${dlabel(d[0].date)}`}</span></div>${d.length>1?spark(d.map(x=>x.v),m.better):""}<div class="small muted">${d.length} ${d.length===1?"entry":"entries"}${self?" · last by athlete":""}</div></div>`}).join("")}</div>`;
}

        if(d.pname)a.contacts.push({id:uid(),name:d.pname,rel:d.prel||"Parent",phone:d.pphone||"",email:""});
        S.athletes.push(a);save();closeModal();U.athleteId=a.id;U.tab="athletes";render();toast(`Added ${fullname(a)}`)}},
    addContact(){contactSheet(v)},
    ctSave(){const n=$("#ct-n").value.trim();if(!n){$("#ct-n").focus();return}ath(v).contacts.push({id:uid(),name:n,rel:$("#ct-r").value.trim()||"Contact",phone:$("#ct-p").value.trim(),email:$("#ct-e").value.trim()});save();closeModal();render();toast("Contact added")},
    sellPack(){sellSheet(v)},
    spSave(){const s=svc(U.sell.sid);const t=ymd(new Date());S.packs.push({id:"p"+uid(),athleteId:U.sell.aid,serviceId:s.id,total:s.packSize,usedBefore:0,price:s.packPrice,purchased:t,expires:addMonths(t,s.expiryMonths),paid:el.dataset.paid==="1",pending:false});
      save();closeModal();render();toast(`${s.packSize}-pack added for ${fullname(ath(U.sell.aid))}`)},
    markPaid(){const k=el.dataset.k;const ref=k==="pack"?S.packs.find(p=>p.id===v):k==="video"?S.videos.find(x=>x.id===v):S.bookings.find(b=>b.id===v);ref.paid=true;ref.pending=false;save();render();toast("Marked paid")},
    addService(){S.services.push({id:"s"+uid(),coachId:v,name:"New session",single:null,packSize:null,packPrice:null,expiryMonths:6,spots:null,online:false,sched:true});save();render()},
    reset(){if(el.dataset.sure){try{localStorage.removeItem(KEY)}catch(e){}IDB.wipe();Object.keys(memBlobs).forEach(k=>delete memBlobs[k]);Object.keys(urlCache).forEach(k=>{URL.revokeObjectURL(urlCache[k]);delete urlCache[k]});mem=null;S=seed();save();U.athleteId=null;render();toast("Demo data reset")}else{el.dataset.sure=1;el.textContent="Tap again to reset"}},
    pBook(){const s=svc(el.dataset.s);const d=el.dataset.d,h=+el.dataset.h;const a=famAth();const p=activePack(a.id,s.id,d);
      modal(`${sheetHead("Confirm booking",`${dlong(d)} · ${hlabel(h)}–${hend(h)}`)}
      <dl class="kv"><dt>Athlete</dt><dd>${esc(fullname(a))}</dd><dt>Session</dt><dd>${esc(s.name)}</dd><dt>Payment</dt><dd>${p?`1 session from your pack (${packLeft(p)} left)`:`${money(s.single)} by Zelle`}</dd></dl>
      <div class="notice warn">Cancellation policy: cancel at least 24 hours before your session. Inside 24 hours, the session counts as used.</div>
      <label class="row small"><input type="checkbox" id="pb-ok"> I understand the 24-hour policy</label>
      <div class="row"><button class="btn primary" data-act="pBookOk" data-s="${s.id}" data-d="${d}" data-h="${h}">Book it</button><button class="btn ghost" data-act="close">Cancel</button></div>`)},
    pBookOk(){if(!$("#pb-ok").checked){$("#pb-ok").focus();toast("Please check the 24-hour policy box");return}
      const s=svc(el.dataset.s),d=el.dataset.d,h=+el.dataset.h;if(openSpots(s.id,d,h)<=0){closeModal();render();toast("Sorry, that spot was just taken");return}
      if(!fits(famAth(),limFor(s.id,d,h))){closeModal();render();toast("This session is for a different age group");return}
      S.bookings.push(mkBooking(U.family,s.coachId,s.id,d,h,null));save();closeModal();render();toast(`Booked · ${dlabel(d)} ${hlabel(h)}`)},
    pSent(){owed(U.family).forEach(o=>o.ref.pending=true);save();render();toast("Thanks · your coach will confirm")},
    pBuy(){const s=svc("hit");const t=ymd(new Date());S.packs.push({id:"p"+uid(),athleteId:U.family,serviceId:s.id,total:s.packSize,usedBefore:0,price:s.packPrice,purchased:t,expires:addMonths(t,s.expiryMonths),paid:false,pending:false});save();render();toast(`Pack added · send ${money(s.packPrice)} by Zelle`)},
    vFilter(){U.vFilter=v;render()},
    openVideo(){closeModal();U.vReturn=U.mode==="coach"&&U.tab==="athletes"&&U.athleteId?U.athleteId:null;const vv=S.videos.find(x=>x.id===v);if(U.mode==="coach"){U.tab="videos";if(vv.status==="waiting"){vv.status="review";save()}}else U.tab="video";U.videoId=v;render();window.scrollTo(0,0)},
    vBack(){AN.cleanup&&AN.cleanup();U.videoId=null;if(U.vReturn){U.tab="athletes";U.athleteId=U.vReturn;U.profTab="video";U.vReturn=null}render()},
    uploadVideo(){uploadSheet()},
    upSave(){el.disabled=true;upSave()},
    anPlay(){const vid=$("#vid");if(!vid)return;if(vid.paused){AN.lastT=vid.currentTime;vid.play().catch(()=>toast("Tap play again"))}else vid.pause()},
    anStep(){const vid=$("#vid");if(!vid)return;vid.pause();vid.currentTime=Math.max(0,Math.min(vid.duration||0,vid.currentTime+(+v)/30));AN.lastT=vid.currentTime;AN.draft.length||(AN.shown=(AN.v.notes.find(n=>Math.abs(n.t-vid.currentTime)<0.05)||{}).id||null);setTimeout(()=>{AN.sync();AN.list();AN.draw()},60)},
    anRate(){const vid=$("#vid");if(!vid)return;vid.playbackRate=+v;document.querySelectorAll('[data-act="anRate"]').forEach(b=>b.classList.toggle("on",b===el))},
    anTool(){AN.tool=v;AN.drawing=null;AN.angleThird=false;document.querySelectorAll('[data-act="anTool"]').forEach(b=>b.classList.toggle("on",b===el));if(v==="angle")toast("Angle: drag along one line, then tap the third point")},
    anColor(){AN.color=v;document.querySelectorAll('[data-act="anColor"]').forEach(b=>b.classList.toggle("on",b===el))},
    anUndo(){AN.draft.pop();AN.drawing=null;AN.draw()},
    anClear(){AN.draft=[];AN.drawing=null;AN.draw()},
    anSave(){anSave()},
    anJump(){const n=AN.v.notes.find(x=>x.id===v);const vid=$("#vid");if(vid){vid.pause();vid.currentTime=n.t;AN.lastT=n.t}AN.shown=n.id;AN.draft=[];AN.list();AN.draw();AN.sync&&setTimeout(AN.sync,60)},
    anEdit(){const n=AN.v.notes.find(x=>x.id===v);const vid=$("#vid");if(vid){vid.pause();vid.currentTime=n.t}AN.editing=n.id;AN.shown=null;AN.draft=(n.shapes||[]).map(s=>({...s,pts:s.pts.map(p=>p.slice())}));$("#anText").value=n.text;$("#anCancel").hidden=false;$("#anSaveBtn").textContent="Update note";$("#anComposeLbl").textContent=`Editing note at ${fmtT(n.t)}`;AN.draw()},
    anCancelEdit(){AN.editing=null;AN.draft=[];$("#anText").value="";$("#anCancel").hidden=true;$("#anSaveBtn").textContent="Save note";AN.draw();AN.sync&&AN.sync()},
    anDel(){if(el.dataset.sure){AN.v.notes=AN.v.notes.filter(x=>x.id!==v);if(AN.shown===v)AN.shown=null;save();AN.list();AN.draw();toast("Note deleted")}else{el.dataset.sure=1;el.textContent="Tap again to delete"}},
    anDone(){const vv=S.videos.find(x=>x.id===v);vv.status="ready";if(vv.tool){const a=ath(vv.athleteId);ensureDev(a);if(!a.train.some(x=>x.videoId===vv.id))a.train.push({id:uid(),videoId:vv.id,date:ymd(new Date()),tool:vv.tool,coachId:vv.coachId,drill:"Video review: "+vv.title,note:""})}save();render();toast("Review sent to the family")},
    anReopen(){const vv=S.videos.find(x=>x.id===v);vv.status="review";save();render()},
    anDelete(){if(el.dataset.sure){const vv=S.videos.find(x=>x.id===v);IDB.del(vv.blobKey);if(urlCache[vv.id]){URL.revokeObjectURL(urlCache[vv.id]);delete urlCache[vv.id]}S.videos=S.videos.filter(x=>x.id!==v);AN.cleanup&&AN.cleanup();U.videoId=null;save();render();toast("Video deleted")}else{el.dataset.sure=1;el.textContent="Tap again to delete"}},
    tScore(){const a=ath(U.athleteId||U.family);ensureDev(a);a.tools[v]=Math.max(1,Math.min(10,a.tools[v]+(+el.dataset.d)));save();render()},
    logTrain(){trainSheet(U.mode==="coach"?U.athleteId:U.family)},
    trSave(){const a=ath(v);ensureDev(a);const w=$("#tr-w").value.trim();if(!w){$("#tr-w").focus();return}a.train.push({id:uid(),date:($("#tr-d").value&&$("#tr-d").value<=ymd(new Date()))?$("#tr-d").value:ymd(new Date()),tool:$("#tr-t").value,coachId:$("#tr-c").value,drill:w,note:$("#tr-n").value.trim(),by:U.mode==="parent"?"athlete":"coach"});save();closeModal();render();toast("Training logged")},
    addMeas(){measSheet(U.mode==="coach"?U.athleteId:U.family)},
    msSave(){const a=ath(v);ensureDev(a);const k=$("#ms-k").value;const val=parseFloat($("#ms-v").value);if(!isFinite(val)||val<=0){$("#ms-v").focus();toast("Enter a number");return}(a.meas[k]=a.meas[k]||[]).push({date:($("#ms-d").value&&$("#ms-d").value<=ymd(new Date()))?$("#ms-d").value:ymd(new Date()),v:+val.toFixed(MEAS[k].dec),by:U.mode==="parent"?"athlete":"coach"});save();closeModal();render();toast(`${MEAS[k].n} saved`)},
    copy(){const val=v;const done=()=>toast("Copied");try{navigator.clipboard.writeText(val).then(done,()=>selectZ())}catch(err){selectZ()}}
  };
  if(A[act])A[act]();
});
function selectZ(){const z=$("#zto");if(!z)return;const r=document.createRange();r.selectNodeContents(z);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected · copy it")}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#modal").innerHTML)closeModal();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}
});
document.addEventListener("change",e=>{
  const el=e.target;const ch=el.dataset.ch;
  if(el.id==="who"){if(U.mode==="coach")U.coachView=el.value;else{U.family=famMembers(el.value)[0].id;U.showFam=false}U.athleteId=null;U.videoId=null;render();return}
  if(!ch)return;
  if(ch==="bkCoach"){pickState.coachId=el.value;pickState.serviceId=null;drawBookSheet()}
  if(ch==="bkSvc"){pickState.serviceId=el.value;drawBookSheet()}
  if(ch==="bkDate"){if(el.value){pickState.date=el.value;ensureWeek(ymd(mondayOf(parse(el.value))))}drawBookSheet()}
  if(ch==="bkHour"){pickState.hour=el.value?+el.value:null;drawBookSheet()}
  if(ch==="bkRep"){pickState.repeat=el.checked}
  if(ch==="alerts"){ath(el.dataset.v).alerts=el.checked;save();render();toast(el.checked?"Open spot alerts on":"Open spot alerts off")}
  if(ch==="anStop"){AN.stopAtNotes=el.checked}
  if(ch==="anTag"){const vv=S.videos.find(x=>x.id===el.dataset.v);vv.tool=el.value;save();toast("Saved")}
  if(ch==="upA"){U.up.aid=el.value;drawUpload()}
  if(ch==="upF"){U.up.file=el.files[0]||null;if(U.up.file&&!U.up.title)U.up.title=U.up.file.name.replace(/.[^.]+$/,"");drawUpload()}
  if(ch==="upC"){U.up.coachId=el.value}
  if(ch==="upTool"){U.up.tool=el.value}
  if(ch==="snFile"){const f=el.files[0];$("#sn-fname").textContent=f?f.name:""}
  if(ch==="exC"){U.ex.coachId=el.value;drawExtra()}
  if(ch==="exD"){if(el.value)U.ex.date=el.value;drawExtra()}
  if(ch==="exF"){U.ex.from=+el.value;if(U.ex.to<=U.ex.from)U.ex.to=U.ex.from+1;drawExtra()}
  if(ch==="exT"){U.ex.to=+el.value;drawExtra()}
  if(ch==="spA"){U.sell.aid=el.value;drawSell()}
  if(ch==="spS"){U.sell.sid=el.value;drawSell()}
  if(ch==="sv"){const s=svc(el.dataset.v);const f=el.dataset.f;
    if(f==="online")s.online=el.checked&&!!s.spots;
    else if(f==="name")s.name=el.value.trim()||s.name;
    else{const n=el.value===""?null:Math.max(0,Math.round(+el.value));
      if(f==="expiryMonths")s[f]=Math.max(1,n||6);else if((f==="minAge"||f==="maxAge")&&n!=null&&s[f==="minAge"?"maxAge":"minAge"]!=null&&(f==="minAge"?n>s.maxAge:n<s.minAge)){s.minAge=Math.min(n,s[f==="minAge"?"maxAge":"minAge"]);s.maxAge=Math.max(n,s[f==="minAge"?"maxAge":"minAge"]);toast("Swapped so youngest is below oldest")}else if(f==="spots"){s.spots=n||null;if(!s.spots)s.online=false}else s[f]=n}
    save();render();toast("Saved")}
  if(ch==="fac"){const val=el.value.trim();if(val)S.facility[el.dataset.f]=val;save();render();toast("Saved")}
});
document.addEventListener("input",e=>{
  const el=e.target;const k=el.dataset.in;if(!k)return;
  const keep=()=>{const id=el.id,pos=el.selectionStart;requestAnimationFrame(()=>{const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}})};
  if(k==="fQ"){U.q=el.value;render();keep()}
  if(k==="fMin"){U.ageMin=el.value;render();keep()}
  if(k==="fMax"){U.ageMax=el.value;render();keep()}
  if(k==="bkQ"){pickState.q=el.value;drawBookSheet();keep()}
  if(k==="exN"){U.ex.note=el.value}
  if(k==="exMin"){U.ex.minAge=el.value}
  if(k==="exMax"){U.ex.maxAge=el.value}
  if(k==="upT"){U.up.title=el.value}
  if(k==="upN"){U.up.note=el.value}
  if(k==="bcMin"){U.bc.ageMin=el.value;drawBroadcast();keep()}
  if(k==="bcMax"){U.bc.ageMax=el.value;drawBroadcast();keep()}
});

/* ---------- boot ---------- */
S=load();
if(!S||S.v!==4){S=seed();save()}
["extra","blocks","broadcasts","videos","recurring","packs","bookings"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(!S.gen)S.gen={};
initDates();
render();
window.__dyn={get S(){return S},U,openSpots,packLeft,activePack,lateCounts,owed,setStatus,hoursUntil};
})();
</script>
