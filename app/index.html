  --teal-hi:#4FC1B9;    /* teal on dark, for text */
  --cream:#F0EBDD;      /* primary text */
  --muted:#93A39D;      /* secondary text */
  --warn:#E3B04B;
  --bad:#E06B5B;
  --good:#5CC48A;
  --c-gil:#4FC1B9; --c-johan:#E3B04B; --c-ozzy:#8FA8F0; --c-gilsr:#D58BD0;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ink);color:var(--cream)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal-hi);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h2{font-size:26px}
h3{font-size:18px;letter-spacing:.04em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand img{width:46px;height:46px;border-radius:50%;flex:none}
.brand .name{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.06em;line-height:1}
.brand .sub{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.22em;color:var(--teal-hi)}
.brand .spacer{flex:1}
.callpill{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--cream);border:1px solid var(--teal);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.callpill svg{width:16px;height:16px;flex:none}
.modebar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:0 10px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--teal);color:#fff}
select.pick{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0;max-width:100%}
.demo-tag{font-size:12px;color:var(--warn);border:1px dashed var(--warn);border-radius:6px;padding:2px 8px;white-space:nowrap}

/* tabs at bottom */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--teal-hi)}

main{padding-block:16px 24px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--cream)}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--teal);background:transparent;display:inline-grid;place-items:center;color:var(--teal-hi);flex:none;text-decoration:none}
.iconbtn svg{width:18px;height:18px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.teal{border-color:var(--teal);color:var(--teal-hi)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip.good{border-color:var(--good);color:var(--good)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* schedule */
.weekstrip{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr)) auto;gap:6px;align-items:stretch}
.weekstrip .nav{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:34px;display:grid;place-items:center;color:var(--muted)}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;min-width:0}
.day .dn{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:14px}
.day .dd{font-size:12px;color:var(--muted)}
.day .open{font-size:11px;color:var(--teal-hi);margin-top:2px}
.day.on{border-color:var(--teal);background:#0f2a28}
.day.today .dn::after{content:" •";color:var(--teal-hi)}
.day.closed{opacity:.45}
.xtra{display:inline-block;font-size:10px;letter-spacing:.06em;color:var(--warn);font-weight:600}
.hour{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start;padding-block:10px;border-top:1px solid var(--line)}
.hour:first-child{border-top:0}
.hour .t{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1}
.hour .t span{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.spots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;min-width:0}
.spot{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--panel-2);text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;border-left-width:4px}
.spot .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.spot.open{border-style:dashed;border-left-style:solid;background:transparent;color:var(--teal-hi)}
.spot.off{background:repeating-linear-gradient(135deg,transparent 0 8px,#141a18 8px 16px);color:var(--muted)}
.spot.done{opacity:.72}
.spot.cancel{opacity:.6;text-decoration:line-through}
.spot.add{border-style:dashed;background:transparent;color:var(--muted);align-items:center;justify-content:center;flex-direction:row;border-left-width:1px}
.hour-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.past .t{color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0;cursor:pointer}
.item .nm{font-weight:600}
.avatar{width:40px;height:40px;border-radius:50%;background:#123b38;color:var(--teal-hi);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;flex:none;letter-spacing:.04em}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input,.filters select,.field input,.field select,.field textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.filters input[type=number]{width:72px}
.togglechip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.togglechip.on{border-color:var(--teal);color:var(--cream);background:#0f2a28}

/* profile */
.prof-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prof-head .avatar{width:64px;height:64px;font-size:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.subtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.subtabs button.on{color:var(--cream);border-bottom-color:var(--teal-hi)}
.meter{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal)}
.preview-banner{border:1px dashed var(--warn);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.stat .u{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stats .card{display:flex;flex-direction:column;gap:6px}
svg text{fill:var(--muted);font-family:var(--body)}
.video{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:radial-gradient(circle at 30% 40%,#1d4a46,#0a1312 70%);display:grid;place-items:center;border:1px solid var(--line);position:relative;overflow:hidden}
.video .play{width:56px;height:56px;border-radius:50%;background:rgba(240,235,221,.9);display:grid;place-items:center}
.video .cap{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--cream);background:rgba(0,0,0,.55);padding:2px 8px;border-radius:6px}
.comment{border-left:3px solid var(--teal);padding:4px 10px;font-size:14px}
.comment b{font-weight:600}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:26px;line-height:1;padding:0 4px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.notice{border-radius:10px;padding:10px 12px;font-size:14px}
.notice.warn{background:#2a2210;border:1px solid var(--warn)}
.notice.info{background:#0f2a28;border:1px solid var(--teal)}
.notice.bad{background:#2a1512;border:1px solid var(--bad)}
.pick-list{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pick-list button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;border:0;border-top:1px solid var(--line);background:none;padding:8px 10px}
.pick-list button:first-child{border-top:0}
.pick-list button.on{background:#0f2a28}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--cream);color:var(--ink);padding:10px 16px;border-radius:10px;z-index:50;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.zelle{background:#1b1430;border:1px solid #6b4fd8;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.zelle .zl{font-family:var(--display);font-weight:800;font-size:22px;color:#b9a5ff;letter-spacing:.04em}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyrow code{font-family:var(--mono);background:var(--panel-2);padding:4px 8px;border-radius:6px;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
/* analyzer */
.an-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.an-grid{grid-template-columns:minmax(0,1fr)}}
.an-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.an-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.stage{position:relative;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-inline:auto;width:100%}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage-msg{pointer-events:none;position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:14px}
.an-ctrl,.an-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg.sm button{padding:4px 10px;font-size:13px}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatch.on{border-color:var(--cream);box-shadow:0 0 0 2px var(--teal)}
.an-compose{display:flex;flex-direction:column;gap:8px}
.an-compose textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.an-note.on{background:#0f2a28;border-radius:8px}
#anSeek{accent-color:var(--teal)}
.nofixed body{padding-bottom:0}
.nofixed nav.tabs{position:static;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
.nofixed .scrim{position:absolute;inset:auto;top:0;left:0;right:0;align-items:flex-start}
.nofixed .sheet{border-radius:18px;max-height:none}
.nofixed .toast{position:absolute;bottom:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  .brand .callpill .txt{display:none}
  .hour{grid-template-columns:52px 1fr}
  .day .ol{display:none}
  .day .dd{font-size:11px}
  .xtra{font-size:0}.day .xtra::before{content:"+";font-size:12px}
  .weekstrip{gap:4px}.weekstrip .nav{width:26px}
  .hour .t{font-size:17px}
  h2{font-size:22px}
}
/* LIGHT v2: near-white page, white cards, firm dividers, filled chips, black header + tab bar */
:root{--ink:#F3F5F4;--panel:#FFFFFF;--panel-2:#F3F5F4;--line:#C9D1CE;--teal:#1C7570;--teal-hi:#135E5A;--cream:#0E1412;--muted:#46524D;--warn:#93600C;--bad:#A8321F;--good:#23703F;
  --c-gil:#1C9A91;--c-johan:#D39A17;--c-ozzy:#4F6FD3;--c-gilsr:#A9539F;color-scheme:light}
html,body{background:var(--ink);color:var(--cream)}
body{font-size:15.5px}
.muted{color:var(--muted)}
h2{color:#060807;font-size:28px}
h3{color:#060807}
.label{color:#3C4843}
/* header + tabs stay black */
header.top{background:#060807;border-bottom:3px solid #2A8C88;color:#F0EBDD}
body::before{background:#060807}
header.top .seg{background:#141a18;border-color:#2c3a36}
header.top .seg button{color:#A9B7B1}
header.top .seg button.on{background:#2A8C88;color:#fff}
header.top select.pick{background:#141a18;color:#F0EBDD;border-color:#2c3a36}
header.top .callpill{color:#F0EBDD;border-color:#2A8C88}
header.top .brand .sub{color:#4FC1B9}
header.top .demo-tag{color:#E3B04B;border-color:#E3B04B}
nav.tabs{background:#060807;border-top:0}
nav.tabs button{color:#A9B7B1;position:relative}
nav.tabs button.on{color:#fff}
nav.tabs button.on::after{content:"";position:absolute;left:28%;right:28%;bottom:4px;height:3px;border-radius:3px;background:#4FC1B9}
.nofixed nav.tabs{border-bottom:1px solid #2A8C88}
/* surfaces */
.card,.tile{background:#fff;border:1px solid var(--line);box-shadow:0 1px 3px rgba(14,20,18,.06)}
.item{border-top:1px solid #DCE2E0}
.hour{border-top:1px solid #D2D9D6;grid-template-columns:76px 1fr}
.hour .t{border-right:2px solid #E1E6E4;padding-right:8px;color:#060807;font-size:22px}
.hour .t span{color:#46524D;font-weight:600}
.hour:nth-child(even){background:#FAFBFB;margin-inline:-14px;padding-inline:14px}
.past .t{color:#8A9692}
/* week strip */
.day{background:#fff;border:1px solid var(--line)}
.day .dn{color:#060807}
.day .dd{color:#46524D}
.day .open{color:#135E5A;font-weight:600}
.day.on{background:#060807;border-color:#060807}
.day.on .dn,.day.on .dd{color:#F0EBDD}
.day.on .open{color:#4FC1B9}
.day.closed{opacity:.55}
.weekstrip .nav{background:#fff;border-color:var(--line);color:#060807}
/* spots */
.spot{background:#fff;border:1px solid #C9D1CE;border-left-width:5px;box-shadow:0 1px 2px rgba(14,20,18,.05)}
.spot .who{color:#060807}
.spot .meta{color:#46524D}
.spot.open{background:#F2FAF9;border:1.5px dashed #1C7570;border-left:5px solid #1C9A91;color:#135E5A;box-shadow:none}
.spot.open .who{color:#135E5A}
.spot.open:hover{background:#E3F4F2}
.spot.off{background:repeating-linear-gradient(135deg,#F5F7F6 0 8px,#E7ECEA 8px 16px);color:#6B7772;box-shadow:none}
.spot.off .who{color:#5E6A65}
.spot.add{background:#fff;border:1.5px dashed #9AA6A2;color:#3C4843}
/* chips: filled, readable */
.chip{border:0;background:#E9EDEB;color:#33403B;font-weight:500}
.chip.teal{background:#DFF1EE;color:#135E5A}
.chip.warn{background:#FBEFD6;color:#7A4E07}
.chip.bad{background:#FBE2DD;color:#9A2C1B}
.chip.good{background:#DFF2E6;color:#1E6236}
/* controls */
.btn{background:#fff;border:1px solid #B9C3BF;color:#0E1412;font-weight:600}
.btn:hover{border-color:#1C7570;background:#F2FAF9}
.btn.primary{background:#060807;border-color:#060807;color:#fff}
.btn.primary:hover{background:#1C7570;border-color:#1C7570}
.btn.ghost{background:transparent}
.btn.danger{border-color:#A8321F;color:#A8321F;background:#fff}
.iconbtn{border:1.5px solid #1C7570;color:#1C7570;background:#fff}
.filters input,.filters select,.field input,.field select,.field textarea,.an-compose textarea{background:#fff;border:1px solid #B9C3BF;color:#0E1412}
.togglechip{border:1px solid #B9C3BF;color:#33403B;background:#fff}
.togglechip.on{background:#060807;border-color:#060807;color:#fff}
.subtabs{border-bottom:2px solid #D2D9D6}
.subtabs button{color:#5E6A65}
.subtabs button.on{color:#060807;border-bottom:3px solid #1C9A91;margin-bottom:-2px}
.seg:not(header .seg){background:#EEF1F0;border-color:#C9D1CE}
.seg:not(header .seg) button.on{background:#060807;color:#fff}
.avatar{background:#060807;color:#4FC1B9}
.meter{background:#E3E8E6}
.notice.warn{background:#FDF4E2;border:1px solid #E0AE4A;color:#4A3307}
.notice.info{background:#EAF5F3;border:1px solid #1C7570;color:#0F3F3C}
.notice.bad{background:#FCE9E5;border:1px solid #A8321F;color:#5C1A10}
.preview-banner{background:#FDF4E2}
.pick-list{border-color:#C9D1CE;background:#fff}
.pick-list button{border-top-color:#E1E6E4}
.pick-list button.on,.an-note.on{background:#DFF1EE}
.zelle{background:#F4F0FF;border-color:#6b4fd8}
.zelle .zl{color:#5435CC}
.copyrow code{background:#EEF1F0}
.scrim{background:rgba(6,8,7,.5)}
.sheet{background:#fff;border-color:#C9D1CE;box-shadow:0 16px 48px rgba(0,0,0,.28)}
.toast{background:#060807;color:#F0EBDD}
.legend{color:#3C4843}
svg text{fill:#46524D}
.famlbl{color:#F0EBDD;font-size:14px}
.famswitch{background:transparent!important;color:#A9B7B1!important;border-color:#2c3a36!important}
.kids{gap:10px}
header.top .seg button.on{background:#1C7570}
.day.on .xtra{color:#F2C25B}
.day.on.today .dn::after{color:#F0EBDD}
.stage-msg{color:#C9D1CE}
.sn{display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--line);padding-top:12px}
.snthumb{border:1px solid var(--line);border-radius:10px;padding:0;margin-top:6px;overflow:hidden;background:var(--panel-2);display:block;max-width:220px}
.snthumb img{display:block;width:100%;height:auto;max-height:160px;object-fit:cover}

/* ---- Gil app additions (on top of base.css light theme) ---- */
.brand .name{font-size:22px}
.hdr-actions{display:flex;gap:8px;align-items:center}
.hdr-btn{background:transparent;border:1px solid #2c3a36;color:#F0EBDD;border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.hdr-btn svg{width:16px;height:16px}
.preview-bar{background:#FBEFD6;color:#4A3307;border-bottom:1px solid #E0AE4A;font-size:14px}
.preview-bar .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:8px;flex-wrap:wrap}
.local-bar{background:#EAF5F3;color:#0F3F3C;border-bottom:1px solid #1C7570;font-size:13px}
.local-bar .wrap{padding-block:6px}
/* level + payment colors */
.lv{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.15)}
.spot.pay-single{background:#FFF7AE}
.spot.pay-pack{background:#D6EEF2}
.spot.req{border-style:dashed;background:#fff}
.spot.req .who::after{content:" · request";font-weight:500;color:#7A4E07}
.legend .sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:#C0392B;color:#fff;font-size:11px;font-weight:700;padding:0 5px;margin-left:4px}
nav.tabs button .badge{position:absolute;top:4px;right:calc(50% - 22px);margin:0}
/* month */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .mh{font-family:var(--display);font-weight:700;font-size:12px;text-align:center;color:#46524D;letter-spacing:.06em}
.mday{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:62px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;font-size:12px}
.mday .d{font-weight:700;color:#060807}
.mday.other{opacity:.35}
.mday.closed{background:repeating-linear-gradient(135deg,#F5F7F6 0 6px,#E7ECEA 6px 12px)}
.mday.today{border-color:#060807;border-width:2px}
.mday .bar{height:5px;border-radius:3px;background:#E3E8E6;overflow:hidden;margin-top:auto}
.mday .bar i{display:block;height:100%;background:#1C7570}
.mday .rq{color:#7A4E07;font-weight:600}
/* schedule builder */
.dayrow{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid #DCE2E0}
.dayrow:first-child{border-top:0}
.dayrow .dn{font-family:var(--display);font-weight:700;font-size:18px;padding-top:4px}
.times{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tchip{display:inline-flex;align-items:center;gap:4px;border:1px solid #B9C3BF;border-radius:999px;padding:3px 4px 3px 10px;background:#fff;font-size:14px}
.tchip button{border:0;background:#EEF1F0;border-radius:50%;width:22px;height:22px;line-height:1;color:#46524D}
.times input[type=time]{border:1px solid #B9C3BF;border-radius:8px;padding:4px 6px;background:#fff}
/* guide */
.steps-list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps-list li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps-list li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:#060807;color:#4FC1B9;display:grid;place-items:center;font-weight:700;font-size:14px}
.wa{background:#1F8F4E!important;border-color:#1F8F4E!important;color:#fff!important}
.wa:hover{background:#17713D!important}
.tool-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #DCE2E0}
.tool-row:first-child{border-top:0}
.score{display:flex;gap:3px;flex-wrap:wrap}
.score button{width:30px;height:30px;border-radius:8px;border:1px solid #B9C3BF;background:#fff;font-weight:600;font-size:13px}
.score button.on{background:#060807;color:#fff;border-color:#060807}
.kidpick{display:flex;gap:6px;flex-wrap:wrap}
.req-card{display:flex;flex-direction:column;gap:8px;padding:12px 4px;border-top:1px solid #DCE2E0}
.req-card:first-child{border-top:0}
.tag3{background:#FBEFD6;color:#7A4E07}
@media (max-width:520px){.hdr-btn .txt{display:none}.mday{min-height:50px;font-size:11px}.dayrow{grid-template-columns:48px 1fr}}

.mday.past{opacity:.55;background:transparent}

</style>
</head>

function save(){S.savedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=JSON.stringify(S)}Store.push()}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}if(mem)return JSON.parse(mem);return null}
function logIt(text){S.log.unshift({at:new Date().toISOString(),text});if(S.log.length>300)S.log.length=300}
/* Store: local now; the cloud adapter (Supabase) plugs in here once the account is connected. */

/* ---------- lookups ---------- */
const ath=id=>S.athletes.find(a=>a.id===id);
const fam=id=>S.families.find(f=>f.id===id);
const famOf=a=>a&&fam(a.familyId);
const famKids=fid=>S.athletes.filter(a=>a.familyId===fid&&!a.archived);
const famLabel=f=>f?(f.name||"Family"):"Family";
const lvColor=l=>S.settings.levelColors[l]||"#9AA0A6";
const primaryContact=f=>f&&(f.contacts||[]).find(c=>c.phone)||(f&&f.contacts||[])[0]||null;

/* ==== 02-logic.js ==== */
/* ---------- schedule rules ---------- */
function dayInfo(date){return S.days[date]||null}
/* start times for a date: weekly hours, unless that day was changed */
function startsShown(date){const s=new Set(startsFor(date));S.bookings.forEach(b=>{if(b.date===date&&LIVE.includes(b.status))s.add(b.start)});return [...s].sort((a,b)=>a-b)}
function startsFor(date){
  const di=dayInfo(date);
  if(di&&di.closed)return [];
  let list=(S.settings.week[parse(date).getDay()]||[]).slice();
  if(di){if(di.remove)list=list.filter(m=>!di.remove.includes(m));if(di.add)list=list.concat(di.add.filter(m=>!list.includes(m)))}
  return list.sort((a,b)=>a-b);
}
function isClosed(date){const di=dayInfo(date);return !!(di&&di.closed)}
const LIVE=["requested","approved"];
function slotBookings(date,m){return S.bookings.filter(b=>b.date===date&&b.start===m&&LIVE.includes(b.status))}
function approvedIn(date,m){return slotBookings(date,m).filter(b=>b.status==="approved")}
function spotsLeft(date,m){return Math.max(0,S.settings.spots-approvedIn(date,m).length)}
/* parents can request a day once it opens: a week ahead at the set time (midnight) */
function opensAt(date){const d=parse(date);d.setDate(d.getDate()-S.settings.openDaysAhead);d.setHours(0,S.settings.openAtMin,0,0);return d}
function isOpenForRequests(date){return new Date()>=opensAt(date)}
function weekKey(date){return ymd(mondayOf(parse(date)))}
function weekCount(aid,date,exceptId){const wk=weekKey(date);return S.bookings.filter(b=>b.athleteId===aid&&LIVE.includes(b.status)&&b.id!==exceptId&&weekKey(b.date)===wk).length}
function nextOpenDay(){for(let i=0;i<8;i++){const d=ymd(addDays(new Date(),i));if(startsFor(d).some(x=>startAt(d,x)>new Date()))return d}return today()}
function byTime(a,b){return a.date===b.date?a.start-b.start:(a.date<b.date?-1:1)}
function isPast(b){return startAt(b.date,b.start)<=new Date()}

/* ---------- packages ---------- */
function packUsed(p){return (p.usedBefore||0)+S.bookings.filter(b=>b.packId===p.id&&(b.status==="approved"||b.status==="late")).length}
function packLeft(p){return Math.max(0,p.total-packUsed(p))}
function packActive(p,onDate){return !p.archived&&(!p.expires||onDate<=p.expires)}
function currentPack(aid,onDate){onDate=onDate||today();return S.packages.filter(p=>p.athleteId===aid&&packActive(p,onDate)&&packLeft(p)>0).sort((a,b)=>a.bought<b.bought?-1:1)[0]||null}
function lastPack(aid){return S.packages.filter(p=>p.athleteId===aid&&!p.archived).sort((a,b)=>a.bought<b.bought?1:-1)[0]||null}
/* decide how a session is paid at the moment it's approved */
function assignPay(b){
  const p=currentPack(b.athleteId,b.date);
  if(p){b.payType="pack";b.packId=p.id;b.price=null}
  else{b.payType="single";b.packId=null;b.price=S.settings.prices.single}
}

/* ---------- money ---------- */
/* what a family owes: single sessions that already happened (or late cancels), unpaid packages, unpaid swing months */
function charges(fid){
  const kids=S.athletes.filter(a=>a.familyId===fid).map(a=>a.id);const out=[];
  S.bookings.filter(b=>kids.includes(b.athleteId)&&b.payType==="single"&&!b.paid&&b.price&&((b.status==="approved"&&isPast(b))||b.status==="late"))
    .forEach(b=>out.push({kind:"session",id:b.id,aid:b.athleteId,amount:b.price,label:`${b.status==="late"?"Late cancel · ":""}${dlabel(b.date)} ${tlabel(b.start)}`}));
  S.packages.filter(p=>kids.includes(p.athleteId)&&!p.archived&&!p.paid&&p.price).forEach(p=>out.push({kind:"pack",id:p.id,aid:p.athleteId,amount:p.price,label:`Package of ${p.total} · bought ${dlabel(p.bought)}`}));
  S.subs.filter(s=>kids.includes(s.athleteId)&&!s.paid).forEach(s=>out.push({kind:"sub",id:s.id,aid:s.athleteId,amount:s.price,label:`Swing analysis · ${MONTHS_LONG[+s.month.slice(5)-1]} ${s.month.slice(0,4)}`}));
  return out;
}
const owes=fid=>charges(fid).reduce((t,c)=>t+(c.amount||0),0);
function blockedForOwing(fid){const f=fam(fid);return owes(fid)>0&&!(f&&f.unlocked)}
function markPaid(kind,id,paid){
  const o=kind==="session"?S.bookings.find(b=>b.id===id):kind==="pack"?S.packages.find(p=>p.id===id):S.subs.find(s=>s.id===id);
  if(o){o.paid=paid;o.paidOn=paid?today():null;const a=ath(o.athleteId);const f=a&&fam(a.familyId);if(paid&&f&&f.unlocked&&owes(f.id)===0)f.unlocked=false}
}
/* swing analysis: one row per month while an athlete is on the plan */
function ensureSubs(){
  const m=today().slice(0,7);
  S.athletes.forEach(a=>{if(a.swingPlan&&!a.archived&&!S.subs.some(s=>s.athleteId===a.id&&s.month===m))S.subs.push({id:"s"+uid(),athleteId:a.id,month:m,price:S.settings.prices.swing,paid:false})});
}

/* ---------- regulars: held before the day opens ---------- */
function ensureRegulars(){
  const t=new Date();let changed=false;
  for(let i=0;i<=S.settings.openDaysAhead+1;i++){
    const date=ymd(addDays(t,i));const dow=parse(date).getDay();
    S.recurring.forEach(r=>{
      if(r.dow!==dow||date<r.from||(r.until&&date>r.until)||(r.skip||[]).includes(date))return;
      if(isClosed(date)||!startsFor(date).includes(r.start))return;
      if(S.bookings.some(b=>b.recurringId===r.id&&b.date===date))return;
      const a=ath(r.athleteId);if(!a||a.archived)return;
      if(approvedIn(date,r.start).length>=S.settings.spots)return;
      const b={id:"b"+uid(),athleteId:r.athleteId,date,start:r.start,status:"approved",source:"regular",recurringId:r.id,createdAt:new Date().toISOString(),approvedAt:new Date().toISOString(),notes:[],sent:{}};
      assignPay(b);S.bookings.push(b);changed=true;
    });
  }
  return changed;
}

/* ---------- actions ---------- */
function requestSession(aid,date,m,note,by){
  const third=weekCount(aid,date)>=S.settings.weeklyLimit;
  const b={id:"b"+uid(),athleteId:aid,date,start:m,status:"requested",source:by||"parent",note:note||"",third,createdAt:new Date().toISOString(),notes:[],sent:{}};
  S.bookings.push(b);logIt(`Request: ${fullname(ath(aid))} · ${dlabel(date)} ${tlabel(m)}`);return b;
}
function addSession(aid,date,m){ /* coach books directly */
  const b={id:"b"+uid(),athleteId:aid,date,start:m,status:"approved",source:"coach",createdAt:new Date().toISOString(),approvedAt:new Date().toISOString(),notes:[],sent:{}};
  assignPay(b);S.bookings.push(b);
  S.waitlist.filter(w=>w.athleteId===aid&&w.date===date&&w.start===m&&w.status!=="done").forEach(w=>w.status="done");
  logIt(`Booked: ${fullname(ath(aid))} · ${dlabel(date)} ${tlabel(m)}`);return b;
}
function approve(b){
  if(spotsLeft(b.date,b.start)<=0)return false;
  b.status="approved";b.approvedAt=new Date().toISOString();assignPay(b);
  S.waitlist.filter(w=>w.athleteId===b.athleteId&&w.date===b.date&&w.start===b.start&&w.status!=="done").forEach(w=>w.status="done");
  logIt(`Approved: ${fullname(ath(b.athleteId))} · ${dlabel(b.date)} ${tlabel(b.start)}`);return true;
}
function decline(b){b.status="declined";logIt(`Declined: ${fullname(ath(b.athleteId))} · ${dlabel(b.date)} ${tlabel(b.start)}`)}
/* cancel: inside the late window it counts as used (or charged) and the spot reopens */
function cancelBooking(b,by){
  const wasApproved=b.status==="approved";
  const late=by==="parent"&&wasApproved&&hoursUntil(b.date,b.start)<S.settings.lateHours;
  b.status=late?"late":"cancelled";b.cancelledBy=by;b.cancelledAt=new Date().toISOString();
  if(b.status==="cancelled"){b.packId=b.payType==="pack"?null:b.packId}
  logIt(`${late?"Late cancel":"Cancelled"}: ${fullname(ath(b.athleteId))} · ${dlabel(b.date)} ${tlabel(b.start)}`);
  return {late,reopened:wasApproved};
}
function forgive(b){b.status="forgiven";b.packId=null;logIt(`Forgiven: ${fullname(ath(b.athleteId))} · ${dlabel(b.date)}`)}
function waitlistFor(date,m){return S.waitlist.filter(w=>w.date===date&&w.start===m&&w.status!=="done").sort((a,b)=>a.createdAt<b.createdAt?-1:1)}
/* waitlist offers Gil should send: an approved spot opened up and someone is waiting */
function openOffers(){
  const out=[];const seen=new Set();
  S.waitlist.filter(w=>w.status==="waiting").forEach(w=>{
    const k=w.date+"|"+w.start;if(seen.has(k))return;
    if(startAt(w.date,w.start)<new Date()||isClosed(w.date))return;
    if(spotsLeft(w.date,w.start)>0){seen.add(k);out.push(waitlistFor(w.date,w.start).filter(x=>x.status==="waiting")[0])}
  });
  return out.filter(Boolean);
}
/* close a day (or some times): sessions are cancelled at no charge and package sessions come back */
function closeDay(date,starts,note){
  const all=!starts;const hit=[];
  S.bookings.filter(b=>b.date===date&&LIVE.includes(b.status)&&(all||starts.includes(b.start))).forEach(b=>{b.status="cancelled";b.cancelledBy="closed";b.packId=null;hit.push(b)});
  const di=S.days[date]=S.days[date]||{};
  if(all){di.closed=true;di.note=note||""}else{di.remove=[...new Set([...(di.remove||[]),...starts])];di.note=note||di.note||""}
  logIt(`Closed ${dlabel(date)}${all?"":" "+starts.map(tlabel).join(", ")}${note?" · "+note:""}`);
  return hit;
}
function reopenDay(date){delete S.days[date];logIt(`Reopened ${dlabel(date)}`)}

/* ---------- reminders (free: Gil taps to send on WhatsApp) ---------- */
function confirmText(b){const a=ath(b.athleteId);return `Hi! ${a.first}'s session with Coach Gil is confirmed for ${dlong(b.date)} at ${tlabel(b.start)}. See you there!`}
function reminderText(b){const a=ath(b.athleteId);return `Reminder: ${a.first} has a hitting session with Coach Gil tomorrow, ${dlong(b.date)}, at ${tlabel(b.start)}. Reply here if anything changes.`}
function closureText(b,note){const a=ath(b.athleteId);return `Hi, Coach Gil here. I have to cancel ${a.first}'s session on ${dlong(b.date)} at ${tlabel(b.start)}${note?` (${note})`:""}. You won't be charged${b.payType==="pack"?" and the session goes back on your package":""}. Request a new time anytime in the app.`}
function offerText(w){const a=ath(w.athleteId);return `Good news! A spot opened for ${a.first} on ${dlong(w.date)} at ${tlabel(w.start)}. Reply YES and I'll lock it in.`}
function phoneFor(aid){const a=ath(aid);if(a&&a.ownLogin&&a.phone)return a.phone;const c=primaryContact(famOf(a));return c?c.phone:(a&&a.phone)||""}
function tomorrowsReminders(){
  const t=ymd(addDays(new Date(),1));
  return S.bookings.filter(b=>b.date===t&&b.status==="approved").sort(byTime);
}

function contentHeight(){const els=[$("header.top"),$("#app"),$("nav.tabs")].filter(Boolean);return Math.ceil(Math.max(...els.map(e=>e.getBoundingClientRect().bottom+scrollY)))}
function stretched(){if($("#modal .sheet"))return document.documentElement.classList.contains("nofixed");const h=contentHeight();return innerHeight>=h-4&&h>(screen.height||800)*1.15}
function applyLayoutMode(){const on=stretched();document.documentElement.classList.toggle("nofixed",on);const nav=$("nav.tabs"),hdr=$("header.top");if(on&&nav.previousElementSibling!==hdr)hdr.after(nav);if(!on&&nav.previousElementSibling===hdr)$("#app").after(nav)}

function modal(html){applyLayoutMode();if(!$("#modal .sheet"))anchorY=lastTapY;$("#modal").innerHTML=`<div class="scrim" data-act="closeScrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  if(document.documentElement.classList.contains("nofixed")){const top=Math.max(8,(anchorY??lastTapY??0)-140);$("#modal .scrim").style.top=top+"px"}

/* ================= SCHEDULE ================= */
function vSchedule(){
  const seg=`<div class="seg sm"><button class="${U.schedView==="week"?"on":""}" data-act="schedView" data-v="week">Week</button><button class="${U.schedView==="month"?"on":""}" data-act="schedView" data-v="month">Month</button></div>`;

function weekStrip(asParent){
  const d0=mondayOf(parse(U.day));let cells="";
  for(let i=0;i<7;i++){const d=ymd(addDays(d0,i));const st=startsFor(d);
    let open=0,req=0;st.forEach(m=>{if(startAt(d,m)>new Date())open+=spotsLeft(d,m);req+=slotBookings(d,m).filter(b=>b.status==="requested").length});
    const notYet=asParent&&!isOpenForRequests(d);
    cells+=`<button class="day ${d===U.day?"on":""} ${d===today()?"today":""} ${!st.length?"closed":""}" data-act="pickDay" data-v="${d}"><div class="dn">${DAYS[parse(d).getDay()]}</div><div class="dd">${parse(d).getDate()}</div><div class="open">${!st.length?(isClosed(d)?"Closed":"—"):d<today()?"—":notYet?"Soon":`${open} open`}</div>${!asParent&&req?`<div class="xtra">${req} req</div>`:""}</button>`}
  return `<div class="weekstrip"><button class="nav" data-act="weekNav" data-v="-7" aria-label="Previous week">${ICON.chevL}</button>${cells}<button class="nav" data-act="weekNav" data-v="7" aria-label="Next week">${ICON.chevR}</button></div>`;
}
function weekView(asParent){
  const d=U.day;const st=startsFor(d);const di=dayInfo(d);
  let rows=(asParent?st:startsShown(d)).map(m=>slotRow(d,m,asParent)).join("");

  ${!asParent&&st.length?`<button class="btn sm" data-act="dayEdit" data-v="${d}">Change this day</button>`:""}</div><div>${rows}</div></div>`;

function opensLabel(d){const o=opensAt(d);return `${DAYS[o.getDay()]} ${MONTHS[o.getMonth()]} ${o.getDate()} at ${tlabel(o.getHours()*60+o.getMinutes())}`}
function slotRow(d,m,asParent){
  const past=startAt(d,m)<new Date();const bs=slotBookings(d,m);const ap=bs.filter(b=>b.status==="approved");const rq=bs.filter(b=>b.status==="requested");
  let cells="";
  if(asParent)return parentSlot(d,m,past,ap);
  ap.forEach(b=>cells+=spotCard(b));
  for(let i=ap.length;i<S.settings.spots;i++)cells+=past?`<div class="spot off"><span class="who">Open (passed)</span></div>`:`<button class="spot open" data-act="openSpot" data-d="${d}" data-m="${m}"><span class="who">Open</span><span class="meta">tap to add someone</span></button>`;
  rq.forEach(b=>cells+=spotCard(b));

  return `<div class="hour ${past?"past":""}"><div class="t">${tshort(m)}<span>${m<720?"AM":"PM"}</span></div><div><div class="spots">${cells}</div>${wl.length?`<div class="small muted" style="margin-top:4px">Waitlist: ${wl.map(w=>esc(ath(w.athleteId).first)).join(", ")}</div>`:""}</div></div>`;
}
function spotCard(b){
  const a=ath(b.athleteId);const cls=b.status==="requested"?"req":b.payType==="pack"?"pay-pack":"pay-single";
  const p=b.payType==="pack"?S.packages.find(x=>x.id===b.packId):null;
  const meta=b.status==="requested"?"Waiting for you":b.payType==="pack"?`Package${p?` · ${packLeft(p)} left`:""}`:`Single ${money(b.price)}${b.paid?" · paid":isPast(b)?" · unpaid":""}`;
  return `<button class="spot ${cls} ${isPast(b)?"done":""}" style="border-left-color:${lvColor(a.level)}" data-act="openBooking" data-v="${b.id}"><span class="who">${esc(fullname(a))}</span><span class="meta">${esc(LEVEL_SHORT[a.level]||"")} · ${meta}${b.recurringId?" · regular":""}</span></button>`;
}
function monthView(asParent){
  const base=U.month?parse(U.month+"-01"):new Date(parse(U.day).getFullYear(),parse(U.day).getMonth(),1);
  const y=base.getFullYear(),mo=base.getMonth();const first=new Date(y,mo,1);const start=mondayOf(first);
  let cells=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>`<div class="mh">${x}</div>`).join("");
  for(let i=0;i<42;i++){const dd=addDays(start,i);const d=ymd(dd);if(i>=35&&dd.getMonth()!==mo)break;
    const st=startsFor(d);let cap=st.length*S.settings.spots,used=0,req=0;st.forEach(m=>{used+=approvedIn(d,m).length;req+=slotBookings(d,m).filter(b=>b.status==="requested").length});
    const past=d<today();if(past){cells+=`<button class="mday past ${dd.getMonth()!==mo?"other":""}" data-act="monthDay" data-v="${d}"><span class="d">${dd.getDate()}</span><span class="muted">${!asParent&&used?`${used} done`:""}</span></button>`;continue}
    cells+=`<button class="mday ${dd.getMonth()!==mo?"other":""} ${isClosed(d)?"closed":""} ${d===today()?"today":""}" data-act="monthDay" data-v="${d}"><span class="d">${dd.getDate()}</span>${cap?`<span>${asParent?`${cap-used} open`:`${used}/${cap}`}</span>${!asParent&&req?`<span class="rq">${req} req</span>`:""}<span class="bar"><i style="width:${Math.round(used/cap*100)}%"></i></span>`:`<span class="muted">${isClosed(d)?"Closed":""}</span>`}</button>`}
  return `<div class="row between"><button class="btn sm" data-act="monthNav" data-v="-1">${ICON.chevL}</button><h3>${MONTHS_LONG[mo]} ${y}</h3><button class="btn sm" data-act="monthNav" data-v="1">${ICON.chevR}</button></div><div class="month">${cells}</div>`;
}

  <div class="field"><label for="nf-p1em">Parent email (optional)</label><input id="nf-p1em" type="email" value="${esc(n.p1em)}" data-in="nf" data-f="p1em"></div>
  <div class="field"><label for="nf-p2">Second parent (optional)</label><input id="nf-p2" value="${esc(n.p2)}" data-in="nf" data-f="p2"></div>

    <div class="field"><label for="k${i}l">Last name</label><input id="k${i}l" value="${esc(k.last)}" data-in="nfk" data-i="${i}" data-f="last" autocomplete="off"></div>
    <div class="field"><label for="k${i}lv">Level</label><select id="k${i}lv" data-ch="nfk" data-i="${i}" data-f="level">${LEVELS.map(l=>`<option ${k.level===l?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label for="k${i}a">Age</label><input id="k${i}a" type="number" min="4" max="60" value="${esc(k.age)}" data-in="nfk" data-i="${i}" data-f="age"></div>
    <div class="field"><label for="k${i}p">Position (optional)</label><input id="k${i}p" value="${esc(k.pos)}" data-in="nfk" data-i="${i}" data-f="pos"></div>

  <div class="row"><button class="btn primary" data-act="nfSave">Save${n.d?" and book":""}</button><button class="btn ghost" data-act="close">Cancel</button></div>`);
}
IN.nf=el=>{U.nf[el.dataset.f]=el.value};
IN.nfk=el=>{U.nf.kids[+el.dataset.i][el.dataset.f]=el.value};
CH.nfk=el=>{U.nf.kids[+el.dataset.i][el.dataset.f]=el.value;drawNF()};
ACT.nfAddKid=()=>{const l=U.nf.kids[0].last;U.nf.kids.push({first:"",last:l,level:"Youth",age:"",pos:"",phone:"",email:""});drawNF()};
ACT.nfDelKid=(el,v)=>{U.nf.kids.splice(+v,1);drawNF()};
ACT.nfSave=()=>{
  const n=U.nf;const kids=n.kids.filter(k=>k.first.trim());
  if(!kids.length){toast("Add at least the athlete's first name");return}
  if(!n.p1.trim()&&!kids.some(k=>k.phone)){toast("Add a parent name (or the athlete's own cell)");return}
  const lastName=(kids[0].last||"").trim()||n.p1.trim().split(" ").slice(-1)[0]||"";
  const f={id:"f"+uid(),name:`${lastName} family`.trim(),contacts:[],unlocked:false,createdAt:today()};
  if(n.p1.trim())f.contacts.push({id:"c"+uid(),name:n.p1.trim(),phone:n.p1ph.trim(),email:n.p1em.trim(),invited:null});
  if(n.p2.trim())f.contacts.push({id:"c"+uid(),name:n.p2.trim(),phone:n.p2ph.trim(),email:"",invited:null});
  S.families.push(f);
  const made=kids.map(k=>{const a={id:"a"+uid(),familyId:f.id,first:k.first.trim(),last:(k.last||lastName).trim(),level:k.level,age:k.age?+k.age:null,pos:k.pos.trim(),phone:(k.phone||"").trim(),email:"",ownLogin:false,swingPlan:false,notes:"",scores:{},createdAt:today()};S.athletes.push(a);return a});
  logIt(`Added ${f.name}`);
  if(n.d&&spotsLeft(n.d,n.m)>0){const b=addSession(made[0].id,n.d,n.m);save();closeModal();render();bookingSheet(b.id,true);return}
  save();closeModal();U.tab="athletes";U.athleteId=made[0].id;U.profTab="overview";render();toast("Saved. Add package counts and send the invite from here")};

    ${o&&f?`<label class="row small" style="gap:6px"><input type="checkbox" data-ch="unlock" data-v="${f.id}" ${f.unlocked?"checked":""}> Let them request anyway (unlock)</label><div class="small muted">${f.unlocked?"Unlocked: they can request even though they owe.":"Locked: they can't request until paid."}</div>`:""}
    <label class="row small" style="gap:6px"><input type="checkbox" data-ch="swingPlan" data-v="${a.id}" ${a.swingPlan?"checked":""}> Swing analysis plan · ${money(S.settings.prices.swing)}/month</label></div>

/* ---- invites: Gil sends the sign-in link himself ---- */
function inviteText(name,link){return `Hi ${name.split(" ")[0]}! Here's your link to request hitting sessions with Coach Gil: ${link}\nTap it, then tap “Sign in.” You'll stay signed in on this phone.`}
async function makeInvite(target){return Store.inviteLink?Store.inviteLink(target):location.href.split("#")[0]}
async function inviteSheet(target,name,phone,mark){
  const link=await makeInvite(target);const text=inviteText(name,link);
  modal(`${sheetHead("Send invite",esc(name))}
  ${Store.mode==="local"?`<div class="notice warn small">Practice mode: sign-in links start working once the app is connected to your storage account. This sends the app link for now.</div>`:""}

  <div class="row">${phone?`<a class="btn wa" href="${waHref(phone,text)}" target="_blank" rel="noopener" data-act="invSent">WhatsApp</a>`:""}<button class="btn" data-act="invCopy">Copy (for email)</button><button class="btn ghost" data-act="close">Close</button></div>`);
  U.inv={text,mark};
}
ACT.invite=(el,v)=>{const f=fam(el.dataset.f);const c=f.contacts.find(x=>x.id===v);inviteSheet({kind:"contact",familyId:f.id,contactId:c.id,email:c.email,phone:c.phone},c.name,c.phone,()=>{c.invited=new Date().toISOString()})};
ACT.inviteAthlete=(el,v)=>{const a=ath(v);inviteSheet({kind:"athlete",athleteId:a.id,email:a.email,phone:a.phone},a.first,a.phone,()=>{a.invited=new Date().toISOString();a.ownLogin=true})};

function drawNP(){const n=U.np;const exp=addMonthsYmd(n.bought,S.settings.expireMonths);
  modal(`${sheetHead(n.id?"Edit package":"Add a package",esc(fullname(ath(n.aid))))}
  <div class="fields"><div class="field"><label for="np-t">Sessions in the package</label><input id="np-t" type="number" min="1" value="${n.total}" data-in="np" data-f="total"></div>
  <div class="field"><label for="np-l">Sessions left right now</label><input id="np-l" type="number" min="0" value="${n.left}" data-in="np" data-f="left"></div>
  <div class="field"><label for="np-p">Price</label><input id="np-p" type="number" min="0" value="${n.price??""}" data-in="np" data-f="price"></div>
  <div class="field"><label for="np-b">Bought on</label><input id="np-b" type="date" value="${n.bought}" data-ch="npB"></div></div>
  <div class="small muted">Already partway through a package? Put how many are left. Expires ${dlong(exp)} (${S.settings.expireMonths} months after buying).</div>
  <label class="row small" style="gap:6px"><input type="checkbox" data-ch="npPaid" ${n.paid?"checked":""}> Already paid</label>
  <div class="row"><button class="btn primary" data-act="npSave">Save</button><button class="btn ghost" data-act="close">Cancel</button>${n.id?`<span class="grow"></span><button class="btn sm danger" data-act="npDel">Remove</button>`:""}</div>`)}
IN.np=el=>{U.np[el.dataset.f]=el.value};CH.npB=el=>{U.np.bought=el.value||today();drawNP()};CH.npPaid=el=>{U.np.paid=el.checked};
ACT.npSave=()=>{const n=U.np;const total=Math.max(1,Math.round(+n.total||0));const left=Math.min(total,Math.max(0,Math.round(+n.left||0)));
  let p=n.id?S.packages.find(x=>x.id===n.id):null;
  if(!p){p={id:"p"+uid(),athleteId:n.aid};S.packages.push(p)}
  const usedAfter=n.id?S.bookings.filter(b=>b.packId===p.id&&(b.status==="approved"||b.status==="late")).length:0;

/* ================= VIDEOS ================= */
/* Files stay on this device in practice mode; the cloud adapter swaps Blobs for online storage. */
const memBlobs={};const urlCache={};
const Blobs={
  db:null,
  open(){if(Blobs.db)return Promise.resolve(Blobs.db);return new Promise((res,rej)=>{try{const r=indexedDB.open("hitwithgil-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>{db.close();Blobs.db=null};Blobs.db=db;res(db)};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("blocked"))}catch(e){rej(e)}})},
  async put(k,blob){memBlobs[k]=blob;if(Store.putFile)return Store.putFile(k,blob);try{const db=await Blobs.open();await new Promise((res,rej)=>{const tx=db.transaction("f","readwrite");tx.objectStore("f").put(blob,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return true}catch(e){return false}},
  async get(k){if(memBlobs[k])return memBlobs[k];if(Store.getFile)return Store.getFile(k);try{const db=await Blobs.open();return await new Promise((res,rej)=>{const r=db.transaction("f").objectStore("f").get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch(e){return null}},
  async del(k){delete memBlobs[k];if(urlCache[k]){URL.revokeObjectURL(urlCache[k]);delete urlCache[k]}if(Store.delFile)return Store.delFile(k);try{const db=await Blobs.open();db.transaction("f","readwrite").objectStore("f").delete(k)}catch(e){}}
};
async function blobURL(k){if(!k)return null;if(urlCache[k])return urlCache[k];const b=await Blobs.get(k);if(!b)return null;urlCache[k]=URL.createObjectURL(b);return urlCache[k]}
function hydrateImgs(){document.querySelectorAll("img[data-img]").forEach(async im=>{const u=await blobURL(im.dataset.img);if(u)im.src=u;else im.replaceWith(Object.assign(document.createElement("span"),{className:"small muted",textContent:"Photo not available on this device"}))})}

/* ==== 08-analyzer.js ==== */
/* analyzer engine (from the demo, Fable-gated) */
function mountAnalyzer(v){
  const stage=$("#stage"),cv=$("#cv"),vid=$("#vid");if(!stage||!cv)return;
  const ctx=cv.getContext("2d");
  const coachMode=U.role==="coach";
  AN.v=v;
  function fit(ratio){
    stage.style.aspectRatio=String(ratio);
    stage.style.width=`min(100%, calc(62vh * ${ratio}))`;
    requestAnimationFrame(size);
  }
  function size(){const w=stage.clientWidth,h=stage.clientHeight;const dpr=window.devicePixelRatio||1;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+"px";cv.style.height=h+"px";draw()}
  AN.size=size;
  const W=()=>cv.width,H=()=>cv.height;
  const P=p=>[p[0]*W(),p[1]*H()];
  function shapeDraw(sh){
    ctx.strokeStyle=sh.color;ctx.fillStyle=sh.color;ctx.lineWidth=Math.max(3,W()*.005);ctx.lineCap="round";ctx.lineJoin="round";
    const pts=sh.pts.map(P);if(!pts.length)return;
    if(sh.type==="free"){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();return}
    if(pts.length<2)return;
    const [a,b]=pts;
    if(sh.type==="line"||sh.type==="arrow"){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();
      if(sh.type==="arrow"){const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);const hl=Math.max(14,W()*.025);ctx.beginPath();ctx.moveTo(...b);ctx.lineTo(b[0]-hl*Math.cos(ang-.45),b[1]-hl*Math.sin(ang-.45));ctx.lineTo(b[0]-hl*Math.cos(ang+.45),b[1]-hl*Math.sin(ang+.45));ctx.closePath();ctx.fill()}}
    if(sh.type==="circle"){ctx.beginPath();ctx.arc(a[0],a[1],Math.hypot(b[0]-a[0],b[1]-a[1]),0,Math.PI*2);ctx.stroke()}
    if(sh.type==="angle"){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);if(pts[2])ctx.lineTo(...pts[2]);ctx.stroke();
      if(pts[2]){const c=pts[2];const a1=Math.atan2(a[1]-b[1],a[0]-b[0]),a2=Math.atan2(c[1]-b[1],c[0]-b[0]);let d=Math.abs(a1-a2);if(d>Math.PI)d=2*Math.PI-d;
        const deg=Math.round(d*180/Math.PI);const r=Math.max(18,W()*.035);ctx.beginPath();let s0=a1,e0=a2;let diff=e0-s0;while(diff>Math.PI)diff-=2*Math.PI;while(diff<-Math.PI)diff+=2*Math.PI;ctx.arc(b[0],b[1],r,s0,s0+diff,diff<0);ctx.stroke();
        const fs=Math.max(13,W()*.022);ctx.font=`600 ${fs}px IBM Plex Sans, sans-serif`;const mid=s0+diff/2;const tx=b[0]+Math.cos(mid)*(r+fs),ty=b[1]+Math.sin(mid)*(r+fs);
        ctx.fillStyle="rgba(0,0,0,.65)";const tw=ctx.measureText(deg+"°").width;ctx.fillRect(tx-tw/2-4,ty-fs*.8,tw+8,fs*1.15);ctx.fillStyle=sh.color;ctx.textAlign="center";ctx.fillText(deg+"°",tx,ty);ctx.textAlign="start"}}
  }
  function draw(){
    ctx.clearRect(0,0,W(),H());
    
    const n=AN.shown&&v.notes.find(x=>x.id===AN.shown);
    if(n)(n.shapes||[]).forEach(shapeDraw);
    if(!vid||vid.paused){AN.draft.forEach(shapeDraw);if(AN.drawing)shapeDraw(AN.drawing)}
  }
  AN.draw=draw;
  function listHTML(){
    const notes=v.notes.slice().sort((a,b)=>a.t-b.t);
    return notes.length?notes.map(n=>`<div class="item an-note ${AN.shown===n.id?"on":""}" style="align-items:flex-start"><button class="chip teal num" data-act="anJump" data-v="${n.id}">${fmtT(n.t)}</button>
      <div class="grow"><div class="small"><b>${n.by==="athlete"?esc(ath(v.athleteId).first):"Coach Gil"}</b>${n.shapes&&n.shapes.length?` <span class="muted">· ${n.shapes.length} drawing${n.shapes.length>1?"s":""}</span>`:""}</div><div style="white-space:pre-wrap">${esc(n.text)||'<span class="muted">(drawing only)</span>'}</div>
      ${(coachMode&&n.by!=="athlete")||(!coachMode&&n.by==="athlete")?`<div class="row" style="gap:6px;margin-top:4px">${coachMode?`<button class="btn sm ghost" data-act="anEdit" data-v="${n.id}">Edit</button>`:""}<button class="btn sm ghost" data-act="anDel" data-v="${n.id}">Delete</button></div>`:""}</div></div>`).join("")
      :`<div class="empty small">${coachMode?"No notes yet. Pause, draw on the frame, and save a note.":"Your coach hasn't added notes yet."}</div>`;
  }
  AN.list=()=>{const l=$("#anList");if(l)l.innerHTML=listHTML()};
  AN.list();
  const timeEl=$("#anTime"),seek=$("#anSeek"),playBtn=$("#anPlay");
  function syncTime(){if(!vid)return;const d=vid.duration||0;timeEl.textContent=`${fmtT(vid.currentTime)} / ${fmtT(d)}`;if(d&&!AN.scrubbing)seek.value=Math.round(vid.currentTime/d*1000);const lbl=$("#anComposeLbl");if(lbl&&!AN.editing)lbl.textContent=`New note at ${fmtT(vid.currentTime)}`}
  AN.sync=syncTime;
  if(!vid){fit(16/9);[playBtn,seek,...document.querySelectorAll('[data-act="anStep"],[data-act="anRate"]')].forEach(b=>b&&(b.disabled=true));timeEl.textContent="";
    if(v.notes[0]){AN.shown=v.notes[0].id;AN.list();draw()}}
  else{
    blobURL(v.blobKey).then(url=>{
      if(!url){const m=$("#stageMsg");m.hidden=false;m.textContent="This video isn't available on this device.";fit(16/9);return}
      vid.src=url;
    });
    vid.addEventListener("loadedmetadata",()=>{fit((vid.videoWidth||16)/(vid.videoHeight||9));syncTime()});
    vid.addEventListener("timeupdate",()=>{
      const t=vid.currentTime;
      if(!vid.paused&&AN.stopAtNotes){const hit=v.notes.filter(n=>n.t>AN.lastT+0.01&&n.t<=t+0.04).sort((a,b)=>a.t-b.t)[0];if(hit){vid.pause();vid.currentTime=hit.t;AN.shown=hit.id;AN.list();draw();AN.lastT=hit.t;syncTime();return}}
      if(!vid.paused){const recent=v.notes.filter(n=>n.t<=t&&t-n.t<1.5).sort((a,b)=>b.t-a.t)[0];const id=recent?recent.id:null;if(id!==AN.shown){AN.shown=id;AN.list();draw()}}
      AN.lastT=t;syncTime();
    });
    vid.addEventListener("play",()=>{playBtn.textContent="Pause";draw()});
    vid.addEventListener("pause",()=>{playBtn.textContent="Play"});
    vid.addEventListener("ended",()=>{playBtn.textContent="Play";AN.lastT=-1});
    seek.addEventListener("input",()=>{AN.scrubbing=true;if(vid.duration){vid.currentTime=seek.value/1000*vid.duration;AN.lastT=vid.currentTime;const near=v.notes.find(n=>Math.abs(n.t-vid.currentTime)<0.15);AN.shown=near?near.id:null;AN.list();draw()}});
    seek.addEventListener("change",()=>{AN.scrubbing=false;syncTime()});
  }
  /* drawing */
  if(coachMode){
    const pos=e=>{const r=cv.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
    cv.style.touchAction="none";cv.style.cursor="crosshair";
    cv.addEventListener("pointerdown",e=>{
      if(vid&&!vid.paused)vid.pause();
      cv.setPointerCapture(e.pointerId);const p=pos(e);
      if(AN.tool==="angle"&&AN.drawing&&AN.drawing.type==="angle"&&AN.drawing.pts.length===2){AN.drawing.pts.push(p);AN.angleThird=true;draw();return}
      AN.drawing={type:AN.tool,color:AN.color,pts:AN.tool==="free"?[p]:[p,p]};draw();
    });
    cv.addEventListener("pointermove",e=>{
      if(!AN.drawing)return;const p=pos(e);
      if(AN.drawing.type==="free"){AN.drawing.pts.push(p)}
      else if(AN.drawing.type==="angle"&&AN.angleThird){AN.drawing.pts[2]=p}
      else if(e.buttons||e.pointerType==="touch"){AN.drawing.pts[1]=p}
      draw();
    });
    cv.addEventListener("pointerup",e=>{
      if(!AN.drawing)return;const d=AN.drawing;
      if(d.type==="angle"&&!AN.angleThird){if(Math.hypot(d.pts[1][0]-d.pts[0][0],d.pts[1][1]-d.pts[0][1])<0.01){AN.drawing=null;draw();toast("Angle: drag along one line, then tap the third point")}return}
      AN.angleThird=false;
      const tiny=d.type!=="free"&&Math.hypot(d.pts[1][0]-d.pts[0][0],d.pts[1][1]-d.pts[0][1])<0.008;
      if(!tiny&&!(d.type==="free"&&d.pts.length<3))AN.draft.push(d);
      AN.drawing=null;draw();
    });
  }
  const ro=new ResizeObserver(()=>size());ro.observe(stage);
  AN.cleanup=()=>{ro.disconnect();if(vid)vid.pause()};
}
function anSave(){
  const v=AN.v;const txt=($("#anText").value||"").trim();const coachMode=U.role==="coach";
  if(!txt&&!AN.draft.length){toast(coachMode?"Draw something or type a note first":"Type a reply first");return}
  const vid=$("#vid");const t=vid?vid.currentTime:0;
  if(AN.editing){const n=v.notes.find(x=>x.id===AN.editing);n.text=txt;n.shapes=AN.draft.slice();AN.editing=null;$("#anCancel").hidden=true;$("#anSaveBtn").textContent="Save note";toast("Note updated");AN.shown=n.id}
  else{const n={id:"n"+uid(),t:+t.toFixed(3),text:txt,shapes:coachMode?AN.draft.slice():[],by:coachMode?"coach":"athlete",at:ymd(new Date())};v.notes.push(n);AN.shown=n.id;toast(coachMode?`Note saved at ${fmtT(t)}`:"Reply sent")}
  if(coachMode&&v.status==="waiting")v.status="review";
  AN.draft=[];$("#anText").value="";save();AN.list();AN.draw();
}

function vSettings(){
  const s=S.settings;
  const num=(f,label,v,min,max,suffix)=>`<div class="field"><label for="st-${f}">${label}</label><div class="row" style="gap:6px"><input id="st-${f}" type="number" min="${min}" ${max!=null?`max="${max}"`:""} value="${v}" data-ch="stNum" data-f="${f}" style="width:90px">${suffix?`<span class="small muted">${suffix}</span>`:""}</div></div>`;
  return `<div class="row between"><h2>Settings</h2><button class="btn sm" data-act="guide" style="white-space:nowrap">${ICON.help} How it works</button></div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Your weekly hours</h3><div class="small muted">Start times for each day. They repeat every week. To change just one day (rain, tournament, extra hours), use “Change this day” on the schedule.</div>
    <div>${[1,2,3,4,5,6,0].map(dw=>`<div class="dayrow"><div class="dn">${DAYS[dw]}</div><div class="times">${(s.week[dw]||[]).slice().sort((a,b)=>a-b).map(m=>`<span class="tchip">${tlabel(m)}<button data-act="wkDel" data-d="${dw}" data-v="${m}" aria-label="Remove ${tlabel(m)}">×</button></span>`).join("")||'<span class="small muted">Closed</span>'}
      <input type="time" step="1800" id="wk-${dw}" aria-label="Add a time on ${DAYS_LONG[dw]}"><button class="btn sm" data-act="wkAdd" data-d="${dw}">Add</button></div></div>`).join("")}</div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>Booking rules</h3><div class="fields">
    ${num("spots","Kids per time slot",s.spots,1,6)}
    ${num("openDaysAhead","Days open ahead",s.openDaysAhead,1,60,"days")}
    <div class="field"><label for="st-open">Each day opens at</label><input id="st-open" type="time" value="${pad(Math.floor(s.openAtMin/60))}:${pad(s.openAtMin%60)}" data-ch="stOpen"></div>
    ${num("weeklyLimit","Requests per kid per week",s.weeklyLimit,1,14,"more go to you to approve")}
    ${num("lateHours","Late cancel window",s.lateHours,0,72,"hours")}
    ${num("expireMonths","Packages expire after",s.expireMonths,1,36,"months")}</div>
    <div class="small muted">Example now: ${dlong(ymd(addDays(new Date(),s.openDaysAhead)))} opens for requests ${opensLabel(ymd(addDays(new Date(),s.openDaysAhead)))}.</div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>Prices</h3><div class="fields">
    <div class="field"><label for="pr-single">Single session</label><input id="pr-single" type="number" min="0" value="${s.prices.single}" data-ch="stPrice" data-f="single"></div>
    <div class="field"><label for="pr-size">Package: sessions</label><input id="pr-size" type="number" min="1" value="${s.prices.packSize}" data-ch="stPrice" data-f="packSize"></div>
    <div class="field"><label for="pr-pack">Package: price</label><input id="pr-pack" type="number" min="0" value="${s.prices.packPrice}" data-ch="stPrice" data-f="packPrice"></div>
    <div class="field"><label for="pr-swing">Swing analysis per month</label><input id="pr-swing" type="number" min="0" value="${s.prices.swing}" data-ch="stPrice" data-f="swing"></div></div>
    <div class="small muted">New prices apply to new sessions and packages. Past ones keep their price.</div>
    <div class="field"><label for="st-zelle">Zelle info parents see on their Pay screen</label><input id="st-zelle" value="${esc(s.zelle)}" placeholder="Name and phone or email" data-ch="stText" data-f="zelle"></div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>What you track</h3><div class="small muted">Rename, add or remove. Scores already logged stay with each kid.</div>
    ${s.tools.map((t,i)=>`<div class="row"><input value="${esc(t.name)}" data-ch="toolName" data-v="${t.id}" aria-label="Tool ${i+1}" style="flex:1;border:1px solid #B9C3BF;border-radius:10px;padding:8px 10px"><button class="btn sm ghost" data-act="toolDel" data-v="${t.id}">Remove</button></div>`).join("")}
    <button class="btn sm" data-act="toolAdd" style="align-self:flex-start">+ Add one</button></div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Colors</h3>
    <div class="fields">${LEVELS.map(l=>`<label class="row small" style="gap:8px"><input type="color" value="${s.levelColors[l]}" data-ch="lvColor" data-v="${l}" aria-label="${l} color"> ${l}</label>`).join("")}</div>${legend()}</div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>App</h3><div class="fields">
    <div class="field"><label for="st-name">App name</label><input id="st-name" value="${esc(s.appName)}" data-ch="stText" data-f="appName"></div>
    <div class="field"><label for="st-ph">Your cell (parents can tap to call)</label><input id="st-ph" type="tel" value="${esc(s.coachPhone)}" data-ch="stText" data-f="coachPhone"></div></div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>See what parents see</h3><div class="small muted">Look at the app exactly as a family does. Nothing you tap there is sent to anyone.</div>
    ${S.families.filter(f=>!f.archived).length?`<div class="row"><select id="pv-f" class="pick" style="background:#fff;border:1px solid #B9C3BF">${S.families.filter(f=>!f.archived).map(f=>`<option value="${f.id}">${esc(famLabel(f))}</option>`).join("")}</select><button class="btn primary" data-act="previewGo">Preview</button></div>`:`<div class="small muted">Add a family first.</div>`}</div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Your data</h3><div class="small muted">Download a copy anytime. It's yours to keep or move.</div>
    <div class="row"><button class="btn" data-act="exportJson">Download backup</button><button class="btn" data-act="exportCsv">Download contacts (spreadsheet)</button><label class="btn" for="imp">Restore a backup</label><input id="imp" type="file" accept="application/json,.json" hidden data-ch="importJson"></div>
    <div class="small muted">${Store.mode==="local"?"Practice mode: saved on this device only until the app is connected to your storage account.":"Saved online to your storage account."}${S.savedAt?` Last saved ${new Date(S.savedAt).toLocaleString()}.`:""}</div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:8px"><h3>Activity</h3><div class="list">${S.log.slice(0,15).map(l=>`<div class="item small"><span class="muted num" style="min-width:92px">${new Date(l.at).toLocaleDateString()}</span><span>${esc(l.text)}</span></div>`).join("")||'<div class="empty small">Nothing yet.</div>'}</div></div>
  ${Store.mode==="local"?`<button class="btn sm danger" data-act="resetAll" style="align-self:flex-start">Start over (erase this device)</button>`:""}`;
}
ACT.wkAdd=el=>{const dw=el.dataset.d;const v=$("#wk-"+dw).value;if(!v){toast("Pick a time first");return}const [h,m]=v.split(":").map(Number);const t=h*60+m;const L=S.settings.week[dw]=S.settings.week[dw]||[];if(!L.includes(t))L.push(t);save();render();toast(`${tlabel(t)} added on ${DAYS_LONG[dw]}s`)};
ACT.wkDel=el=>{const dw=el.dataset.d,m=+el.dataset.v;const future=S.bookings.filter(b=>LIVE.includes(b.status)&&b.start===m&&parse(b.date).getDay()===+dw&&!isPast(b)).length;
  if(future&&!el.dataset.sure){el.dataset.sure=1;el.textContent="!";toast(`${future} booked at ${tlabel(m)} on upcoming ${DAYS_LONG[dw]}s. They stay booked. Tap × again to remove the time`);return}
  S.settings.week[dw]=S.settings.week[dw].filter(x=>x!==m);save();render()};
CH.stNum=el=>{const f=el.dataset.f;let n=Math.round(+el.value);const min=+el.min||0;if(isNaN(n)||n<min)n=min;if(el.max&&n>+el.max)n=+el.max;S.settings[f]=n;save();render();toast("Saved")};
CH.stOpen=el=>{const [h,m]=(el.value||"00:00").split(":").map(Number);S.settings.openAtMin=h*60+m;save();render();toast("Saved")};
CH.stPrice=el=>{const n=Math.max(0,+el.value||0);S.settings.prices[el.dataset.f]=el.dataset.f==="packSize"?Math.max(1,Math.round(n)):n;save();render();toast("Saved")};
CH.stText=el=>{S.settings[el.dataset.f]=el.value.trim();save();render();toast("Saved")};
CH.toolName=(el,v)=>{const t=S.settings.tools.find(x=>x.id===v);t.name=el.value.trim()||t.name;save();toast("Saved")};
ACT.toolAdd=()=>{S.settings.tools.push({id:"t"+uid(),name:"New"});save();render()};
ACT.toolDel=(el,v)=>{if(!el.dataset.sure){el.dataset.sure=1;el.textContent="Tap again";return}S.settings.tools=S.settings.tools.filter(t=>t.id!==v);save();render()};
CH.lvColor=(el,v)=>{S.settings.levelColors[v]=el.value;save();render()};
ACT.previewGo=()=>{const f=$("#pv-f").value;U.preview=f;U.role="parent";U.asAthlete=null;U.kid=null;U.tab="book";U.day=nextOpenDay();U.videoId=null;render();scrollTo(0,0)};
ACT.previewExit=()=>{U.preview=null;U.role="coach";U.tab="settings";U.videoId=null;render()};
function download(name,text,type){const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
ACT.exportJson=()=>{download(`hit-with-gil-backup-${today()}.json`,JSON.stringify(S,null,1),"application/json");toast("Backup downloaded (videos not included)")};
ACT.exportCsv=()=>{const q=x=>`"${String(x??"").replace(/"/g,'""')}"`;const rows=[["Athlete","Level","Age","Family","Parent","Parent cell","Parent email","Package left","Owes"]];
  S.athletes.filter(a=>!a.archived).forEach(a=>{const f=famOf(a);const cs=(f&&f.contacts.length?f.contacts:[{}]);const p=currentPack(a.id);cs.forEach(c=>rows.push([fullname(a),a.level,a.age,famLabel(f),c.name,c.phone,c.email,p?packLeft(p):"",f?owes(f.id):0]))});
  download(`hit-with-gil-contacts-${today()}.csv`,rows.map(r=>r.map(q).join(",")).join("\n"),"text/csv");toast("Spreadsheet downloaded")};
CH.importJson=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.settings||!Array.isArray(d.athletes))throw 0;U.imp=d;
  modal(`${sheetHead("Restore this backup?",`${d.athletes.length} athletes · ${d.bookings.length} sessions · saved ${d.savedAt?new Date(d.savedAt).toLocaleString():"?"}`)}<div class="notice warn small">This replaces everything in the app now.</div><div class="row"><button class="btn danger" data-act="impGo">Replace with backup</button><button class="btn ghost" data-act="close">Cancel</button></div>`)}catch(e){toast("That file isn't a backup from this app")}};r.readAsText(f)};
ACT.impGo=()=>{S=Object.assign(defaults(),U.imp);save();closeModal();render();toast("Backup restored")};
ACT.resetAll=el=>{if(!el.dataset.sure){el.dataset.sure=1;el.textContent="Tap again: erase everything on this device";return}S=defaults();S.settings.guideDone=true;save();render();toast("Started over")};

/* ---- first-run guide ---- */
function guideSheet(){
  modal(`${sheetHead("How it works","About 2 minutes")}
  <ol class="steps-list">
  <li><div><b>Check your hours.</b> Settings › Your weekly hours. Your times are already in. Change any day on the schedule (rain, tournament, extra hours).</div></li>
  <li><div><b>Add your athletes.</b> Athletes › Add a family: parent's name and cell, then the kids. Kids already on a package? Add the package and type how many sessions are left.</div></li>
  <li><div><b>Send invites.</b> On a kid's page, tap Send invite next to the parent. It opens WhatsApp with the link ready, or copy it into an email. High schoolers and up can get their own.</div></li>
  <li><div><b>Approve requests.</b> Parents request open times. You approve or decline on the Today tab, then tap Confirm to send the WhatsApp confirmation.</div></li>
  <li><div><b>Reminders.</b> Each day, Today shows tomorrow's sessions with a Remind button. One tap per family.</div></li>
  <li><div><b>Money.</b> Mark sessions and packages paid as Zelle comes in. Families who owe can't request until they pay, unless you unlock them.</div></li>
  <li><div><b>Someone called?</b> Tap any open spot on the schedule to add them yourself.</div></li>
  </ol>
  <div class="small muted">Save the app to your Home Screen: in Safari tap Share, then “Add to Home Screen.”</div>
  <div class="row"><button class="btn primary" data-act="guideDone">Got it</button><button class="btn" data-act="guideSchedule">Show my hours</button></div>`);
}
ACT.guide=()=>guideSheet();
ACT.guideDone=()=>{S.settings.guideDone=true;save();closeModal()};
ACT.guideSchedule=()=>{S.settings.guideDone=true;save();closeModal();U.tab="settings";render();scrollTo(0,0)};

/* ==== 10-main.js ==== */
/* ================= RENDER ================= */
const COACH_TABS=[["today","Today",ICON.today],["schedule","Schedule",ICON.cal],["athletes","Athletes",ICON.people],["videos","Videos",ICON.video],["money","Money",ICON.money]];
const PARENT_TABS=[["book","Request",ICON.cal],["mine","Sessions",ICON.today],["videos","Videos",ICON.video],["progress","Progress",ICON.user],["pay","Pay",ICON.money]];
function render(){
  if(AN.cleanup&&!(U.videoId)){AN.cleanup();AN.cleanup=null}
  const parent=U.role==="parent";
  document.title=S.settings.appName;$("#appName").textContent=S.settings.appName;
  const reqN=S.bookings.filter(b=>b.status==="requested"&&!isPast(b)).length;
  $("#hdrActions").innerHTML=parent?(S.settings.coachPhone?`<a class="hdr-btn" href="${telHref(S.settings.coachPhone)}">${ICON.phone}<span class="txt">Call Coach Gil</span></a>`:""):`<button class="hdr-btn" data-act="tab" data-v="settings" aria-label="Settings">${ICON.gear}<span class="txt">Settings</span></button>`;
  $("#bars").innerHTML=(U.preview?`<div class="preview-bar"><div class="wrap"><span>Preview: what the <b>${esc(famLabel(pFam()))}</b> sees.</span><button class="btn sm" data-act="previewExit">Exit preview</button></div></div>`:"")+(Store.mode==="local"&&!parent?`<div class="local-bar"><div class="wrap">Practice mode: saved on this device until your storage account is connected.</div></div>`:"");
  const tabs=parent?PARENT_TABS:COACH_TABS;
  if(!parent&&U.tab==="settings"){}else if(!tabs.some(t=>t[0]===U.tab))U.tab=tabs[0][0];
  $("#tabs").innerHTML=tabs.map(([k,l,ic])=>`<button class="${U.tab===k?"on":""}" data-act="tab" data-v="${k}">${ic}<span>${l}</span>${k==="today"&&reqN?`<span class="badge">${reqN}</span>`:""}</button>`).join("");
  const app=$("#app");
  if(parent){app.innerHTML={book:vParentSchedule,mine:vParentMine,videos:vParentVideo,progress:vParentProgress,pay:vParentPay}[U.tab]()}
  else app.innerHTML={today:vToday,schedule:vSchedule,athletes:vAthletes,videos:vVideos,money:vMoney,settings:vSettings}[U.tab]();
  hydrateImgs();applyLayoutMode();
}

/* ================= EVENTS ================= */
ACT.tab=(el,v)=>{closeModal();if(U.videoId){AN.cleanup&&AN.cleanup();U.videoId=null}U.tab=v;if(v==="athletes")U.athleteId=null;if(v==="money")U.familyId=null;render();scrollTo(0,0)};
ACT.close=()=>closeModal();
ACT.closeScrim=(el,v,e)=>{if(e.target===el)closeModal()};
ACT.schedView=(el,v)=>{U.schedView=v;U.month=null;render()};
ACT.pickDay=(el,v)=>{U.day=v;render()};
ACT.weekNav=(el,v)=>{U.day=ymd(addDays(parse(U.day),+v));render()};
ACT.monthNav=(el,v)=>{const b=U.month?parse(U.month+"-01"):new Date(parse(U.day).getFullYear(),parse(U.day).getMonth(),1);b.setMonth(b.getMonth()+(+v));U.month=`${b.getFullYear()}-${pad(b.getMonth()+1)}`;render()};
ACT.monthDay=(el,v)=>{U.day=v;U.schedView="week";U.month=null;render()};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const f=ACT[el.dataset.act];if(!f)return;
  if(el.tagName==="A"&&el.getAttribute("href")&&!el.getAttribute("href").startsWith("#")){f(el,el.dataset.v,e);return}
  if(el.dataset.act!=="closeScrim")e.preventDefault();
  f(el,el.dataset.v,e);
});
document.addEventListener("change",e=>{const el=e.target;const k=el.dataset&&el.dataset.ch;if(k&&CH[k])CH[k](el,el.dataset.v)});
document.addEventListener("input",e=>{const el=e.target;const k=el.dataset&&el.dataset.in;if(k&&IN[k])IN[k](el)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal .sheet"))closeModal();if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}});

/* ================= START ================= */
function boot(){
  S=load();
  if(!S||S.v!==1)S=defaults();
  S=Object.assign(defaults(),S);S.settings=Object.assign(defaults().settings,S.settings);
  {const D=defaults();Object.keys(D).forEach(k=>{if(Array.isArray(D[k])&&!Array.isArray(S[k]))S[k]=D[k];else if(D[k]&&typeof D[k]==="object"&&!Array.isArray(D[k])&&(!S[k]||typeof S[k]!=="object"))S[k]=D[k]});Object.keys(D.settings).forEach(k=>{const v=D.settings[k];if(v&&typeof v==="object"&&(S.settings[k]==null||typeof S.settings[k]!=="object"))S.settings[k]=v})}
  U.day=nextOpenDay();
  const a=ensureRegulars();ensureSubs();const c=clearOldVideos();if(a||c)save();else{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  Store.init();
  render();
  if(!S.settings.guideDone)setTimeout(guideSheet,300);
}
boot();
window.__hwg={U,render,cancelBooking,charges,packLeft,ymd,save,get S(){return S}};

})();
</script>
